name: Build BeeLlama v0.4.6 Codex Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout BeeLlama v0.4.6
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout v0.4.6
          git submodule update --init --recursive

          Write-Host "Version:"
          git describe --tags --always

          Write-Host "Commit:"
          git rev-parse HEAD


      # ------------------------------------------------------------
      # Codex Responses API compatibility fix
      #
      # Before:
      #   input_text only
      #
      # After:
      #   input_text OR output_text
      # ------------------------------------------------------------
      - name: Patch Codex output_text support
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          Write-Host "Searching patch target..."

          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text" `
              -Context 5,5

          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}'

          $replacement = @'
          if (!chatcmpl_output.contains("type") ||
              (chatcmpl_output.at("type") != "input_text" &&
               chatcmpl_output.at("type") != "output_text")) {
              throw std::invalid_argument(
                  "Output of tool call should be 'input_text' or 'output_text'");
          }
          '@

          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
              Write-Error "Codex patch target was not found."
              exit 1
          }

          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8

          Write-Host ""
          Write-Host "Patch applied:"
          git diff -- $path


      - name: Verify Codex patch
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          if (-not $content.Contains('"output_text"')) {
              Write-Error "output_text was not found after patch."
              exit 1
          }

          Write-Host "Codex patch verification OK."

          Select-String `
              -Path $path `
              -Pattern "output_text" `
              -Context 4,4


      # ------------------------------------------------------------
      # Install CUDA 13.3 directly from NVIDIA
      # ------------------------------------------------------------
      - name: Download CUDA 13.3 installer
        shell: pwsh
        run: |
          $url = "https://developer.download.nvidia.com/compute/cuda/13.3.0/network_installers/cuda_13.3.0_windows_network.exe"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
              -Uri $url `
              -OutFile "$env:RUNNER_TEMP\cuda-installer.exe"


      - name: Install CUDA 13.3
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\cuda-installer.exe"

          Start-Process `
              -FilePath $installer `
              -ArgumentList "-s nvcc_13.3 cudart_13.3" `
              -Wait `
              -NoNewWindow

          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"

          if (-not (Test-Path "$cuda\bin\nvcc.exe")) {
              Write-Error "CUDA installation failed: nvcc.exe not found"
              exit 1
          }

          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          "$cuda\bin" >> $env:GITHUB_PATH


      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          nvcc --version

          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              Write-Error "nvcc verification failed."
              exit 1
          }


      # ------------------------------------------------------------
      # Configure BeeLlama
      #
      # RTX 4070 Ti SUPER = Ada / sm_89
      #
      # ALL_QUANTS is intentionally ON because your runtime uses
      # KVarN cache combinations.
      # ------------------------------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CUDA_FA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES=89 `
            -DCMAKE_BUILD_TYPE=Release


      - name: Build BeeLlama
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      - name: Show binaries
        shell: pwsh
        run: |
          Write-Host "Build output:"

          Get-ChildItem `
              build\bin\Release `
              -File


      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------
      - name: Create package
        shell: pwsh
        run: |
          $package = "package"

          New-Item `
              -ItemType Directory `
              -Path $package `
              -Force |
              Out-Null

          Copy-Item `
              build\bin\Release\*.exe `
              $package `
              -ErrorAction SilentlyContinue

          Copy-Item `
              build\bin\Release\*.dll `
              $package `
              -ErrorAction SilentlyContinue


          git rev-parse HEAD |
              Out-File `
                  "$package\source-commit.txt" `
                  -Encoding ascii

          git describe --tags --always |
              Out-File `
                  "$package\source-version.txt" `
                  -Encoding ascii

          git diff |
              Out-File `
                  "$package\codex-output-text-fix.patch" `
                  -Encoding utf8


          @"
          BeeLlama Codex compatibility build

          Source:
          BeeLlama v0.4.6

          Platform:
          Windows x64

          CUDA:
          13.3

          CUDA architecture:
          sm_89
          RTX 40 series / Ada

          CMake:
          GGML_CUDA=ON
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=ON
          GGML_NATIVE=OFF

          Codex Responses API patch:

          function_call_output accepts:

          input_text
          output_text

          Purpose:

          Fixes:

          HTTP 400
          Output of tool call should be 'Input text'
          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8


      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
              -Path package\* `
              -DestinationPath "beellama-v0.4.6-codex-fix-cuda13.3-sm89.zip" `
              -Force


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-v0.4.6-codex-fix-cuda13.3-sm89
          path: beellama-v0.4.6-codex-fix-cuda13.3-sm89.zip
          if-no-files-found: error
