name: Build BeeLlama v0.4.6 Codex Fix sm75 sm89 SelfHosted

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # ============================================================
      # Checkout
      #
      # IMPORTANT:
      # clean: false
      #
      # self-hosted runner 上の build/ を削除せず、
      # 次回の Ninja 差分ビルドに再利用する。
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          clean: false

      # ============================================================
      # Reset source only
      #
      # build/ は未追跡ディレクトリなので残す。
      # 前回適用した Codex patch は tracked file なので
      # git reset --hard で元に戻す。
      # ============================================================
      - name: Checkout BeeLlama v0.4.6
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner user:"
          whoami

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

          git fetch --tags --force

          git checkout v0.4.6
          git reset --hard v0.4.6

          git submodule sync --recursive
          git submodule update --init --recursive

          Write-Host ""
          Write-Host "Version:"
          git describe --tags --always

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

      # ============================================================
      # Verify local build environment
      #
      # self-hosted runner:
      #
      # CUDA / Ninja / CMake は毎回インストールしない。
      # PC にインストール済みのものを使用する。
      # ============================================================
      - name: Verify local build tools
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host " Git"
          Write-Host "========================================="

          where.exe git
          git --version


          Write-Host ""
          Write-Host "========================================="
          Write-Host " CMake"
          Write-Host "========================================="

          where.exe cmake
          cmake --version


          Write-Host ""
          Write-Host "========================================="
          Write-Host " Ninja"
          Write-Host "========================================="

          where.exe ninja
          ninja --version


          Write-Host ""
          Write-Host "========================================="
          Write-Host " CUDA"
          Write-Host "========================================="

          where.exe nvcc
          nvcc --version


          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              throw "git was not found in PATH."
          }

          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
              throw "cmake was not found in PATH."
          }

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              throw "ninja was not found in PATH."
          }

          if (-not (Get-Command nvcc -ErrorAction SilentlyContinue)) {
              throw "nvcc was not found in PATH."
          }


      # ============================================================
      # Codex Responses API compatibility patch
      #
      # Handles:
      #
      #   input_text
      #   output_text
      #   text
      #   input_image
      #   raw string
      # ============================================================
      - name: Patch Codex tool output compatibility
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              throw "File not found: $path"
          }

          $content = Get-Content $path -Raw

          Write-Host "Original target:"

          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text|chatcmpl_output" `
              -Context 10,10


          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}\s*chatcmpl_output\["type"\]\s*=\s*"text"\s*;'


          $replacement = @'
          SRV_WRN("Codex function_call_output item: %s\n",
                  chatcmpl_output.dump().c_str());

          if (chatcmpl_output.is_string()) {
              chatcmpl_output = {
                  {"type", "text"},
                  {"text", chatcmpl_output.get<std::string>()}
              };

          } else if (chatcmpl_output.is_object()) {

              const std::string type =
                  json_value(chatcmpl_output, "type", std::string());

              if (type == "input_text" ||
                  type == "output_text" ||
                  type == "text") {

                  if (!chatcmpl_output.contains("text") ||
                      !chatcmpl_output.at("text").is_string()) {

                      throw std::invalid_argument(
                          "Tool output text block requires 'text'");
                  }

                  chatcmpl_output["type"] = "text";

              } else if (type == "input_image") {

                  if (!chatcmpl_output.contains("image_url") ||
                      !chatcmpl_output.at("image_url").is_string()) {

                      throw std::invalid_argument(
                          "Tool output image block requires string 'image_url'");
                  }

                  const std::string url =
                      chatcmpl_output.at("image_url").get<std::string>();

                  chatcmpl_output = {
                      {"type", "image_url"},
                      {"image_url", {
                          {"url", url}
                      }}
                  };

              } else {

                  throw std::invalid_argument(
                      "Unsupported tool output content type: " + type);
              }

          } else {

              throw std::invalid_argument(
                  "Unsupported tool output content");
          }
          '@


          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )


          if ($patched -eq $content) {

              Write-Host ""
              Write-Host "Patch target was not found."

              Select-String `
                  -Path $path `
                  -Pattern "Output of tool call|input_text|chatcmpl_output" `
                  -Context 20,20

              throw "Codex compatibility patch was NOT applied."
          }


          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8


          Write-Host ""
          Write-Host "Patch applied:"

          git diff -- $path


      # ============================================================
      # Verify patch
      # ============================================================
      - name: Verify Codex patch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $path = "tools/server/server-chat.cpp"

          $content = Get-Content $path -Raw


          if (-not $content.Contains("Codex function_call_output item")) {
              throw "Debug logging was not found."
          }


          if (-not $content.Contains('type == "input_image"')) {
              throw "input_image support was not found."
          }


          if (-not $content.Contains('{"type", "image_url"}')) {
              throw "image_url conversion was not found."
          }


          if (-not $content.Contains('type == "output_text"')) {
              throw "output_text support was not found."
          }


          Write-Host "Codex compatibility patch verification OK."


      # ============================================================
      # Visual Studio / CUDA environment check
      #
      # CUDA 13.3 must already be installed locally.
      # ============================================================
      - name: Verify Visual Studio and CUDA environment
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo =========================================
          echo Compiler
          echo =========================================

          where cl
          if errorlevel 1 exit /b 1

          cl


          echo.
          echo =========================================
          echo CUDA
          echo =========================================

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version


          echo.
          echo =========================================
          echo CMake
          echo =========================================

          where cmake
          if errorlevel 1 exit /b 1

          cmake --version


          echo.
          echo =========================================
          echo Ninja
          echo =========================================

          where ninja
          if errorlevel 1 exit /b 1

          ninja --version


      # ============================================================
      # Show existing build cache
      #
      # self-hosted runner では build/ を直接保持する。
      # GitHub actions/cache は使用しない。
      # ============================================================
      - name: Check persistent build directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          Write-Host "========================================="
          Write-Host " Persistent build directory"
          Write-Host "========================================="

          if (Test-Path "build\CMakeCache.txt") {

              Write-Host ""
              Write-Host "BUILD CACHE FOUND"
              Write-Host ""

              Get-Item "build\CMakeCache.txt" |
                  Select-Object FullName, LastWriteTime

          }
          else {

              Write-Host ""
              Write-Host "NO BUILD CACHE"
              Write-Host "Full build will be required."
          }


      # ============================================================
      # Configure
      #
      # RTX 2080 Ti       = Turing = sm_75
      # RTX 4070 Ti SUPER = Ada    = sm_89
      #
      # Native SASS only:
      #
      #   75-real
      #   89-real
      #
      # QUANT:
      #
      #   GGML_CUDA_FA_ALL_QUANTS=OFF
      #
      # ============================================================
      - name: Configure BeeLlama
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo ===== Configure =====

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="75-real;89-real"

          if errorlevel 1 exit /b 1


      # ============================================================
      # Verify CMake configuration
      # ============================================================
      - name: Verify CMake configuration
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $cache = "build\CMakeCache.txt"

          if (-not (Test-Path $cache)) {
              throw "CMakeCache.txt was not found."
          }


          Write-Host ""
          Write-Host "Relevant CMake options:"

          Select-String `
              -Path $cache `
              -Pattern "CMAKE_CUDA_ARCHITECTURES|GGML_CUDA_FA_ALL_QUANTS|GGML_CUDA_FA:|GGML_CUDA:"


          $arch = Select-String `
              -Path $cache `
              -Pattern "^CMAKE_CUDA_ARCHITECTURES"


          if (-not $arch) {
              throw "CMAKE_CUDA_ARCHITECTURES was not found."
          }


          Write-Host ""
          Write-Host "Architecture:"
          Write-Host $arch.Line


          if ($arch.Line -notmatch "75-real;89-real") {
              throw "Expected CUDA architectures 75-real;89-real."
          }


          $quant = Select-String `
              -Path $cache `
              -Pattern "^GGML_CUDA_FA_ALL_QUANTS"


          if ($quant) {

              Write-Host ""
              Write-Host "ALL_QUANTS:"
              Write-Host $quant.Line

              if ($quant.Line -notmatch "OFF") {
                  throw "GGML_CUDA_FA_ALL_QUANTS is not OFF."
              }
          }


          Write-Host ""
          Write-Host "Configuration OK:"
          Write-Host "sm75-real + sm89-real"
          Write-Host "ALL_QUANTS = OFF"


      # ============================================================
      # Build llama-server ONLY
      #
      # i7-11700 / 32GB を想定。
      #
      # NVCC を大量並列にすると RAM / paging で
      # 逆に遅くなる可能性があるため parallel=4。
      #
      # build/ が残っていれば Ninja が差分だけビルド。
      # ============================================================
      - name: Build llama-server only
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo ===== Build llama-server =====

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            --parallel 4

          if errorlevel 1 exit /b 1


      # ============================================================
      # Show output
      # ============================================================
      - name: Show build output
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          Write-Host "Build output:"

          Get-ChildItem `
              build\bin `
              -Recurse `
              -File


      # ============================================================
      # Package
      #
      # EXE:
      #   llama-server.exe only
      #
      # DLL:
      #   build output DLLs
      # ============================================================
      - name: Create package
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $package = "package"


          Remove-Item `
              $package `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue


          New-Item `
              -ItemType Directory `
              -Path $package `
              -Force |
              Out-Null


          if (Test-Path "build\bin\Release") {
              $bin = "build\bin\Release"
          }
          else {
              $bin = "build\bin"
          }


          Write-Host "Using binary directory:"
          Write-Host $bin


          # ----------------------------------------------------------
          # llama-server.exe ONLY
          # ----------------------------------------------------------

          $server = Join-Path $bin "llama-server.exe"


          if (-not (Test-Path $server)) {
              throw "llama-server.exe was not found: $server"
          }


          Copy-Item `
              $server `
              -Destination $package `
              -Force


          # ----------------------------------------------------------
          # DLLs
          # ----------------------------------------------------------

          Get-ChildItem `
              $bin `
              -Filter "*.dll" `
              -File |
              Copy-Item `
                  -Destination $package `
                  -Force


          # ----------------------------------------------------------
          # Source information
          # ----------------------------------------------------------

          git rev-parse HEAD |
              Out-File `
                  "$package\source-commit.txt" `
                  -Encoding ascii


          git describe --tags --always |
              Out-File `
                  "$package\source-version.txt" `
                  -Encoding ascii


          git diff |
              Out-File `
                  "$package\codex-tool-output-image-fix.patch" `
                  -Encoding utf8


          # ----------------------------------------------------------
          # Build information
          # ----------------------------------------------------------

          @"
          BeeLlama Codex compatibility build

          Source:
          BeeLlama v0.4.6

          Runner:
          GitHub Actions self-hosted Windows

          OS:
          Windows x64

          Compiler:
          Microsoft Visual C++ / Visual Studio 2022

          Generator:
          Ninja Multi-Config

          CUDA:
          Local CUDA installation

          CUDA architectures:

          sm_75-real
          RTX 2080 Ti / Turing

          sm_89-real
          RTX 4070 Ti SUPER / Ada

          Build target:

          llama-server only

          Build options:

          GGML_CUDA=ON
          GGML_NATIVE=OFF
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=OFF
          LLAMA_BUILD_TESTS=OFF

          CMAKE_CUDA_ARCHITECTURES=75-real;89-real

          Build reuse:

          Local build directory preserved.
          Ninja incremental build enabled.

          Build parallelism:

          4

          Codex Responses API compatibility:

          Supported function_call_output content:

          - raw string
          - input_text
          - output_text
          - text
          - input_image

          Text blocks normalize to:

          type = text

          Image blocks normalize to:

          type = image_url
          image_url.url = original image_url

          Debug logging:

          Codex function_call_output item: <raw JSON>
          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8


      # ============================================================
      # Verify package
      # ============================================================
      - name: Verify package
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Packaged files:"

          Get-ChildItem `
              package `
              -File |
              Sort-Object Name


          $server = Get-ChildItem `
              package `
              -Filter "llama-server.exe" `
              -File `
              -ErrorAction SilentlyContinue


          if (-not $server) {
              throw "llama-server.exe was not packaged."
          }


          $cuda = Get-ChildItem `
              package `
              -Filter "ggml-cuda.dll" `
              -File `
              -ErrorAction SilentlyContinue


          if (-not $cuda) {
              throw "ggml-cuda.dll was not packaged."
          }


          Write-Host ""
          Write-Host "Required binaries found:"
          Write-Host "llama-server.exe OK"
          Write-Host "ggml-cuda.dll OK"


      # ============================================================
      # ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "beellama-v0.4.6-codex-image-fix-selfhosted-sm75-sm89-faoff-server.zip"


          Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue


          Compress-Archive `
              -Path package\* `
              -DestinationPath $zip `
              -Force


          Write-Host ""
          Write-Host "ZIP:"

          Get-Item $zip |
              Select-Object `
                  Name,
                  @{N="MiB";E={[math]::Round($_.Length / 1MB, 2)}}


      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-v0.4.6-codex-image-fix-selfhosted-sm75-sm89-faoff-server
          path: beellama-v0.4.6-codex-image-fix-selfhosted-sm75-sm89-faoff-server.zip
          if-no-files-found: error
