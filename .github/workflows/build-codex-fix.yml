name: Build BeeLlama v0.4.6 Codex Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout BeeLlama v0.4.6
        shell: pwsh
        run: |
          git fetch --tags --force
          git checkout v0.4.6
          git submodule update --init --recursive

          Write-Host "Version:"
          git describe --tags --always

          Write-Host "Commit:"
          git rev-parse HEAD


      # ============================================================
      # Codex Responses API compatibility patch
      #
      # Fix:
      #   HTTP 400
      #   Output of tool call should be 'Input text'
      #
      # Accept:
      #   input_text
      #   output_text
      # ============================================================
      - name: Patch Codex output_text support
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          Write-Host "Current target:"
          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text" `
              -Context 6,6

          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}'

          $replacement = @'
          if (!chatcmpl_output.contains("type") ||
              (chatcmpl_output.at("type") != "input_text" &&
               chatcmpl_output.at("type") != "output_text")) {
              throw std::invalid_argument(
                  "Output of tool call should be 'input_text' or 'output_text'");
          }
          '@

          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
              Write-Host ""
              Write-Host "Patch target not found."
              Write-Host "Relevant source:"
              Select-String `
                  -Path $path `
                  -Pattern "Output of tool call|input_text|output_text" `
                  -Context 10,10

              Write-Error "Codex patch was NOT applied. Aborting."
              exit 1
          }

          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8

          Write-Host ""
          Write-Host "Patch applied:"
          git diff -- $path


      # ============================================================
      # Verify patch
      # ============================================================
      - name: Verify Codex patch
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          if (-not $content.Contains('"output_text"')) {
              Write-Error "output_text support not found."
              exit 1
          }

          Write-Host "Codex patch verification OK."

          Select-String `
              -Path $path `
              -Pattern "output_text" `
              -Context 5,5


      # ============================================================
      # CUDA 13.3
      #
      # Use llama.cpp/BeeLlama's own Windows CUDA setup action.
      # This installs all required pieces:
      #   cudart
      #   nvcc
      #   nvrtc
      #   libcublas
      #   libnvvm
      #   VS integration
      #   CCCL
      # etc.
      # ============================================================
      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: 'x64'


      # ============================================================
      # Verify CUDA
      # ============================================================
      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          nvcc --version

          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              Write-Error "nvcc.exe was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "CUDA bin:"
          Get-ChildItem "$env:CUDA_PATH\bin" |
              Select-Object -First 20


      # ============================================================
      # Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

          ninja --version


      # ============================================================
      # Configure + Build
      #
      # IMPORTANT:
      # We explicitly enter the VS2022 MSVC environment BEFORE
      # calling CMake, preventing windows runner from selecting
      # C:\mingw64\bin\cc.exe.
      #
      # RTX 4070 Ti SUPER:
      #   Ada / sm_89
      # ============================================================
      - name: Configure and Build BeeLlama
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          where cl
          where nvcc
          where ninja

          cl

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=89

          if errorlevel 1 exit /b 1

          cmake --build build --config Release --parallel

          if errorlevel 1 exit /b 1


      # ============================================================
      # Show build result
      # ============================================================
      - name: Show build output
        shell: pwsh
        run: |
          Write-Host "build/bin:"
          Get-ChildItem `
              build\bin `
              -Recurse `
              -File


      # ============================================================
      # Package
      #
      # Ninja Multi-Config normally outputs Release under:
      #   build/bin/Release
      #
      # Fall back to build/bin if necessary.
      # ============================================================
      - name: Create package
        shell: pwsh
        run: |
          $package = "package"

          New-Item `
              -ItemType Directory `
              -Path $package `
              -Force |
              Out-Null

          if (Test-Path "build\bin\Release") {
              $bin = "build\bin\Release"
          }
          else {
              $bin = "build\bin"
          }

          Write-Host "Using binary directory:"
          Write-Host $bin

          Get-ChildItem `
              $bin `
              -Filter "*.exe" `
              -File |
              Copy-Item `
                  -Destination $package

          Get-ChildItem `
              $bin `
              -Filter "*.dll" `
              -File |
              Copy-Item `
                  -Destination $package


          # Source information
          git rev-parse HEAD |
              Out-File `
                  "$package\source-commit.txt" `
                  -Encoding ascii

          git describe --tags --always |
              Out-File `
                  "$package\source-version.txt" `
                  -Encoding ascii


          # Save exact patch
          git diff |
              Out-File `
                  "$package\codex-output-text-fix.patch" `
                  -Encoding utf8


          # Build information
          @"
          BeeLlama Codex compatibility build

          Source:
          BeeLlama v0.4.6

          OS:
          Windows x64

          Compiler:
          Microsoft Visual C++ / Visual Studio 2022

          Generator:
          Ninja Multi-Config

          CUDA:
          13.3

          CUDA architecture:
          sm_89
          RTX 4070 Ti SUPER / Ada

          Build options:

          GGML_CUDA=ON
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=ON
          GGML_NATIVE=OFF

          Codex Responses API compatibility patch:

          function_call_output accepts both:

          input_text
          output_text

          Intended fix:

          HTTP 400
          Output of tool call should be 'Input text'
          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8


      # ============================================================
      # Verify package
      # ============================================================
      - name: Verify package
        shell: pwsh
        run: |
          Write-Host "Packaged files:"
          Get-ChildItem package -File

          $server = Get-ChildItem `
              package `
              -Filter "llama-server.exe" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $server) {
              Write-Error "llama-server.exe was not packaged."
              exit 1
          }

          $cuda = Get-ChildItem `
              package `
              -Filter "ggml-cuda.dll" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $cuda) {
              Write-Error "ggml-cuda.dll was not packaged."
              exit 1
          }

          Write-Host ""
          Write-Host "Required binaries found."


      # ============================================================
      # ZIP
      # ============================================================
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
              -Path package\* `
              -DestinationPath "beellama-v0.4.6-codex-fix-cuda13.3-sm89.zip" `
              -Force


      # ============================================================
      # Upload
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-v0.4.6-codex-fix-cuda13.3-sm89
          path: beellama-v0.4.6-codex-fix-cuda13.3-sm89.zip
          if-no-files-found: error
