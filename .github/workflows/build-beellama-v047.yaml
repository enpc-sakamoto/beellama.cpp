name: Build BeeLlama latest ubd Codex CUDA12.4 sm75 sm89

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # Checkout latest BeeLlama main
      # ============================================================

      - name: Checkout BeeLlama latest main
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: main
          fetch-depth: 0
          submodules: recursive


      # ============================================================
      # Record source commit
      # ============================================================

      - name: Record source commit
        id: source
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $short = $commit.Substring(0, 12)

          Write-Host "========================================="
          Write-Host " BeeLlama source"
          Write-Host "========================================="

          git log -1 `
            --format="Commit: %H%nDate: %ci%nSubject: %s"

          "commit=$commit" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Verify -ubd exists in source
      # ============================================================

      - name: Verify ubd exists in source
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Verify -ubd source implementation"
          Write-Host "========================================="

          $matches = @(
            Get-ChildItem `
              common,tools `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
            Select-String `
              -Pattern "spec-draft-ubatch-size"
          )

          if ($matches.Count -eq 0) {
            Write-Error "spec-draft-ubatch-size was not found in current BeeLlama main."
            exit 1
          }

          $matches |
            Select-Object Path, LineNumber, Line |
            Format-Table -AutoSize -Wrap

          Write-Host ""
          Write-Host "-ubd source entry found."


      # ============================================================
      # Inspect current Responses API function_call_output handler
      # ============================================================

      - name: Inspect Codex function_call_output handler
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
            Write-Error "File not found: $path"
            exit 1
          }

          Write-Host "========================================="
          Write-Host " Responses API function_call_output"
          Write-Host "========================================="

          Select-String `
            -Path $path `
            -Pattern "function_call_output|Output of tool call|chatcmpl_output" `
            -Context 12,12


      # ============================================================
      # Minimal Codex patch
      #
      # Current llama.cpp/BeeLlama already handles:
      #
      # - Responses API
      # - assistant output_text
      # - function_call_output as raw string
      #
      # Missing compatibility we need:
      #
      # function_call_output.output array:
      #
      # - input_text
      # - output_text
      # - text
      # - input_image
      #
      # ============================================================

      - name: Patch Codex function_call_output compatibility
        id: codex
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          # Already patched?
          if (
            $content.Contains("Codex function_call_output compatibility") -and
            $content.Contains('type == "output_text"') -and
            $content.Contains('type == "input_image"')
          ) {
            Write-Host "Codex compatibility patch already present."
            "state=already-present" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Upstream/BeeLlama may eventually implement this itself.
          # If function_call_output already explicitly accepts output_text
          # and input_image, do not patch.
          $functionSection = (
            Select-String `
              -Path $path `
              -Pattern 'item\.at\("type"\) == "function_call_output"' `
              -Context 0,50 |
            Out-String
          )

          if (
            $functionSection -match 'output_text' -and
            $functionSection -match 'input_image'
          ) {
            Write-Host "Upstream function_call_output already supports required Codex content types."
            "state=upstream-supported" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Current upstream-style block:
          #
          # for (json & chatcmpl_output : chatcmpl_outputs) {
          #     if (!chatcmpl_output.contains("type") ||
          #         chatcmpl_output.at("type") != "input_text") {
          #         throw ...
          #     }
          #     chatcmpl_output["type"] = "text";
          # }

          $pattern = @'
          for\s*\(\s*json\s*&\s*chatcmpl_output\s*:\s*chatcmpl_outputs\s*\)\s*\{\s*
          if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*
          chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*
          throw\s+std::invalid_argument\("Output of tool call should be 'Input text'"\);\s*
          \}\s*
          chatcmpl_output\["type"\]\s*=\s*"text"\s*;\s*
          \}
          '@

          $replacement = @'
          // Codex function_call_output compatibility
          for (json & chatcmpl_output : chatcmpl_outputs) {

              if (chatcmpl_output.is_string()) {

                  chatcmpl_output = {
                      {"type", "text"},
                      {"text", chatcmpl_output.get<std::string>()}
                  };

                  continue;
              }

              if (!chatcmpl_output.is_object()) {
                  throw std::invalid_argument(
                      "Unsupported tool output content");
              }

              const std::string type =
                  json_value(chatcmpl_output, "type", std::string());

              if (type == "input_text" ||
                  type == "output_text" ||
                  type == "text") {

                  if (!chatcmpl_output.contains("text") ||
                      !chatcmpl_output.at("text").is_string()) {

                      throw std::invalid_argument(
                          "Tool output text block requires 'text'");
                  }

                  chatcmpl_output["type"] = "text";

              } else if (type == "input_image") {

                  if (!chatcmpl_output.contains("image_url") ||
                      !chatcmpl_output.at("image_url").is_string()) {

                      throw std::invalid_argument(
                          "Tool output image block requires string 'image_url'");
                  }

                  const std::string url =
                      chatcmpl_output.at("image_url").get<std::string>();

                  chatcmpl_output = {
                      {"type", "image_url"},
                      {"image_url", {
                          {"url", url}
                      }}
                  };

              } else {

                  throw std::invalid_argument(
                      "Unsupported tool output content type: " + type);
              }
          }
          '@

          $patched = [regex]::Replace(
            $content,
            $pattern,
            $replacement,
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
            Write-Host ""
            Write-Host "Expected upstream function_call_output block was not found."

            Select-String `
              -Path $path `
              -Pattern "function_call_output|chatcmpl_output|Output of tool call" `
              -Context 20,20

            Write-Error "Codex compatibility patch could not be applied safely."
            exit 1
          }

          Set-Content `
            -Path $path `
            -Value $patched `
            -NoNewline `
            -Encoding UTF8

          Write-Host "========================================="
          Write-Host " Codex patch applied"
          Write-Host "========================================="

          git diff -- $path

          "state=patched" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Verify Codex compatibility
      # ============================================================

      - name: Verify Codex compatibility
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          $state = "${{ steps.codex.outputs.state }}"

          Write-Host "Codex state: $state"

          if ($state -eq "patched" -or $state -eq "already-present") {

            $required = @(
              'type == "input_text"',
              'type == "output_text"',
              'type == "text"',
              'type == "input_image"',
              '{"type", "image_url"}'
            )

            foreach ($item in $required) {

              if (-not $content.Contains($item)) {
                Write-Error "Codex compatibility verification failed: $item"
                exit 1
              }
            }
          }

          Write-Host "Codex compatibility OK."


      # ============================================================
      # CUDA 12.4.1
      # ============================================================

      - name: Install CUDA Toolkit 12.4.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: 'network'


      # ============================================================
      # Verify CUDA
      # ============================================================

      - name: Verify CUDA 12.4
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " CUDA"
          Write-Host "========================================="

          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue

          if (-not $nvcc) {
            Write-Error "nvcc was not found."
            exit 1
          }

          Write-Host $nvcc.Source

          $version = (& nvcc --version 2>&1 | Out-String)

          Write-Host $version

          if ($version -notmatch "release 12\.4") {
            Write-Error "CUDA 12.4 is not active."
            exit 1
          }


      # ============================================================
      # Visual Studio
      # ============================================================

      - name: Resolve Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          $vsPath = $vsPath.Trim()

          if (-not $vsPath) {
            Write-Error "Visual Studio installation was not found."
            exit 1
          }

          $vcvars = Join-Path `
            $vsPath `
            "VC\Auxiliary\Build\vcvarsall.bat"

          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvarsall.bat was not found."
            exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          "path=$vsPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Ninja
      # ============================================================

      - name: Install Ninja
        shell: pwsh
        run: |
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue

          if (-not $ninja) {
            choco install ninja -y --no-progress
          }

          where.exe ninja
          ninja --version


      # ============================================================
      # Build cache
      # ============================================================

      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build
          key: beellama-${{ steps.source.outputs.short }}-win2022-cuda1241-sm75-sm89-v1


      - name: Show cache status
        shell: pwsh
        run: |
          if ("${{ steps.build-cache.outputs.cache-hit }}" -eq "true") {
            Write-Host "CACHE HIT"
          }
          else {
            Write-Host "CACHE MISS"
          }


      # ============================================================
      # Configure
      #
      # RTX 2080 Ti       = sm75
      # RTX 4070 Ti SUPER = sm89
      # ============================================================

      - name: Configure BeeLlama
        shell: cmd
        run: |
          set "VS_PATH=${{ steps.vs.outputs.path }}"

          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          echo =========================================
          echo Compiler
          echo =========================================

          where cl
          if errorlevel 1 exit /b 1

          cl

          echo =========================================
          echo CUDA
          echo =========================================

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version

          echo =========================================
          echo Configure
          echo =========================================

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="75-real;89-real"

          if errorlevel 1 exit /b 1


      # ============================================================
      # Build llama-server
      # ============================================================

      - name: Build llama-server
        shell: cmd
        run: |
          set "VS_PATH=${{ steps.vs.outputs.path }}"

          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            --parallel

          if errorlevel 1 exit /b 1


      # ============================================================
      # Locate server
      # ============================================================

      - name: Locate llama-server
        id: server
        shell: pwsh
        run: |
          $server = Get-ChildItem `
            build `
            -Recurse `
            -Filter "llama-server.exe" `
            -File |
            Select-Object -First 1

          if (-not $server) {
            Write-Error "llama-server.exe was not found."
            exit 1
          }

          Write-Host $server.FullName

          "path=$($server.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$($server.Directory.FullName)" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Verify compiled -ubd
      # ============================================================

      - name: Verify compiled ubd option
        shell: pwsh
        run: |
          $server = "${{ steps.server.outputs.path }}"

          $help = (
            & $server --help 2>&1 |
            Out-String
          )

          Write-Host "========================================="
          Write-Host " Draft ubatch"
          Write-Host "========================================="

          $help -split "`r?`n" |
            Select-String `
              -Pattern "spec-draft-ubatch-size|-ubd" |
            ForEach-Object {
              Write-Host $_.Line
            }

          if ($help -notmatch "spec-draft-ubatch-size") {
            Write-Error "--spec-draft-ubatch-size / -ubd is NOT exposed by this build."
            exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: -ubd is available."


      # ============================================================
      # Save draft options
      # ============================================================

      - name: Show speculative options
        shell: pwsh
        run: |
          $server = "${{ steps.server.outputs.path }}"

          $help = (
            & $server --help 2>&1 |
            Out-String
          )

          $help -split "`r?`n" |
            Select-String `
              -Pattern "spec-draft|draft-device|draft-ngl|ubd" |
            ForEach-Object {
              Write-Host $_.Line
            }


      # ============================================================
      # Package
      # ============================================================

      - name: Create package
        shell: pwsh
        run: |
          $package = "package"
          $server = "${{ steps.server.outputs.path }}"
          $bin = "${{ steps.server.outputs.dir }}"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force |
            Out-Null


          # EXE
          Copy-Item `
            $server `
            -Destination $package `
            -Force


          # DLLs
          Get-ChildItem `
            $bin `
            -Filter "*.dll" `
            -File |
            Copy-Item `
              -Destination $package `
              -Force


          # Source info
          git rev-parse HEAD |
            Out-File `
              "$package\source-commit.txt" `
              -Encoding ascii

          git log -1 `
            --format="Commit: %H%nDate: %ci%nSubject: %s" |
            Out-File `
              "$package\source-details.txt" `
              -Encoding utf8


          # Patch
          git diff -- tools/server/server-chat.cpp |
            Out-File `
              "$package\codex-function-call-output.patch" `
              -Encoding utf8


          # llama-server version
          (
            & $server --version 2>&1 |
            Out-String
          ) |
            Out-File `
              "$package\llama-server-version.txt" `
              -Encoding utf8


          # Draft options
          $help = (
            & $server --help 2>&1 |
            Out-String
          )

          $help -split "`r?`n" |
            Select-String `
              -Pattern "spec-draft|draft-device|draft-ngl|ubd" |
            ForEach-Object {
              $_.Line
            } |
            Out-File `
              "$package\draft-options.txt" `
              -Encoding utf8


          # CUDA
          (
            & nvcc --version 2>&1 |
            Out-String
          ) |
            Out-File `
              "$package\cuda-version.txt" `
              -Encoding utf8


          # Build info
          @"
          BeeLlama latest main custom build
          =================================

          Source:
          https://github.com/Anbeeld/beellama.cpp

          Commit:
          ${{ steps.source.outputs.commit }}


          Required draft option:

          --spec-draft-ubatch-size
          -ubd


          Intended runtime example:

          -b 2048
          -ub 1024
          -ubd 128


          CUDA:

          CUDA Toolkit 12.4.1


          Architectures:

          sm75
          RTX 2080 Ti

          sm89
          RTX 4070 Ti SUPER


          Build:

          GGML_CUDA=ON
          GGML_NATIVE=OFF
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=OFF
          LLAMA_BUILD_TESTS=OFF


          Codex Responses API:

          Current upstream/BeeLlama already provides general
          Responses API support.

          This build additionally normalizes function_call_output
          array content for:

          input_text
          output_text
          text
          input_image


          Codex patch state:

          ${{ steps.codex.outputs.state }}

          "@ |
            Out-File `
              "$package\BUILD-INFO.txt" `
              -Encoding utf8


      # ============================================================
      # Verify package
      # ============================================================

      - name: Verify package
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Package"
          Write-Host "========================================="

          Get-ChildItem `
            package `
            -File |
            Sort-Object Name |
            Select-Object Name, Length


          $required = @(
            "package\llama-server.exe",
            "package\draft-options.txt",
            "package\BUILD-INFO.txt",
            "package\source-commit.txt"
          )

          foreach ($file in $required) {

            if (-not (Test-Path $file)) {
              Write-Error "Missing package file: $file"
              exit 1
            }
          }


          $cudaDll = Get-ChildItem `
            package `
            -Filter "ggml-cuda.dll" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $cudaDll) {
            Write-Error "ggml-cuda.dll was not packaged."
            exit 1
          }


          $draft = Get-Content `
            "package\draft-options.txt" `
            -Raw

          if ($draft -notmatch "spec-draft-ubatch-size") {
            Write-Error "-ubd missing from packaged draft-options.txt."
            exit 1
          }

          Write-Host ""
          Write-Host "Package verification OK."


      # ============================================================
      # ZIP
      # ============================================================

      - name: Create ZIP
        shell: pwsh
        run: |
          $short = "${{ steps.source.outputs.short }}"

          $zip = "beellama-main-$short-ubd-codex-cuda12.4-sm75-sm89.zip"

          Remove-Item `
            $zip `
            -Force `
            -ErrorAction SilentlyContinue

          Compress-Archive `
            -Path package\* `
            -DestinationPath $zip `
            -Force

          Write-Host "========================================="
          Write-Host " ZIP"
          Write-Host "========================================="

          Get-Item $zip |
            Select-Object `
              Name,
              @{N="MiB";E={[math]::Round($_.Length / 1MB, 2)}}


      # ============================================================
      # Upload
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-main-${{ steps.source.outputs.short }}-ubd-codex-cuda12.4-sm75-sm89
          path: beellama-main-${{ steps.source.outputs.short }}-ubd-codex-cuda12.4-sm75-sm89.zip
          if-no-files-found: error
