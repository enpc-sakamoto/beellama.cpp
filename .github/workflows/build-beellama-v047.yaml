name: Build BeeLlama v0.4.7 Preview Codex Fix sm75 sm89

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # Checkout BeeLlama v0.4.7 Preview
      #
      # preview-v0.4.7
      # expected commit:
      # 0d055e157fd3...
      #
      # Fix the exact commit so that a moving preview tag cannot
      # silently produce a different binary.
      # ============================================================
      - name: Checkout BeeLlama v0.4.7 Preview
        shell: pwsh
        run: |
          $expectedCommit = "0d055e157fd3"

          Write-Host "========================================="
          Write-Host " Fetch BeeLlama v0.4.7 Preview"
          Write-Host "========================================="

          git fetch --all --tags --force

          # Show the preview tag for diagnostics.
          Write-Host ""
          Write-Host "preview-v0.4.7 tag:"
          git rev-parse preview-v0.4.7

          # Build the exact known v0.4.7 Preview commit.
          git checkout --force $expectedCommit

          git submodule sync --recursive
          git submodule update --init --recursive

          Write-Host ""
          Write-Host "===== Source version ====="
          git describe --tags --always

          Write-Host ""
          Write-Host "===== Source commit ====="
          $actualCommit = (git rev-parse HEAD).Trim()
          Write-Host $actualCommit

          if (-not $actualCommit.StartsWith($expectedCommit)) {
              Write-Error "Wrong BeeLlama source commit."
              Write-Error "Expected: $expectedCommit"
              Write-Error "Actual:   $actualCommit"
              exit 1
          }

          Write-Host ""
          Write-Host "BeeLlama v0.4.7 Preview source verification OK."

      # ============================================================
      # Verify source contains v0.4.7 draft batch options
      #
      # Before spending time compiling, make sure the selected source
      # really contains the new independent draft sizing options.
      # ============================================================
      - name: Verify v0.4.7 source features
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Verify v0.4.7 draft sizing source"
          Write-Host "========================================="

          $matches = Get-ChildItem `
              -Path common,tools `
              -Recurse `
              -File `
              -Include *.cpp,*.h,*.hpp `
              -ErrorAction SilentlyContinue |
              Select-String `
                  -Pattern "spec-draft-ubatch-size|spec_draft_ubatch|spec-draft-batch-size" `
                  -ErrorAction SilentlyContinue

          if (-not $matches) {
              Write-Error "v0.4.7 draft batch options were not found in source."
              exit 1
          }

          $matches |
              Select-Object -First 30 |
              ForEach-Object {
                  Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              }

          Write-Host ""
          Write-Host "Draft sizing source verification OK."

      # ============================================================
      # Codex Responses API compatibility patch
      #
      # Handles:
      #
      #   raw string
      #   input_text
      #   output_text
      #   text
      #   input_image
      #
      # If v0.4.7 changed the target code, STOP instead of applying
      # a patch to an uncertain location.
      # ============================================================
      - name: Patch Codex tool output compatibility
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          Write-Host "========================================="
          Write-Host " Original Codex patch target"
          Write-Host "========================================="

          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text|chatcmpl_output" `
              -Context 10,10

          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}\s*chatcmpl_output\["type"\]\s*=\s*"text"\s*;'

          $replacement = @'
          SRV_WRN("Codex function_call_output item: %s\n",
                  chatcmpl_output.dump().c_str());

          if (chatcmpl_output.is_string()) {
              chatcmpl_output = {
                  {"type", "text"},
                  {"text", chatcmpl_output.get<std::string>()}
              };
          } else if (chatcmpl_output.is_object()) {
              const std::string type =
                  json_value(chatcmpl_output, "type", std::string());

              if (type == "input_text" ||
                  type == "output_text" ||
                  type == "text") {
                  if (!chatcmpl_output.contains("text") ||
                      !chatcmpl_output.at("text").is_string()) {
                      throw std::invalid_argument(
                          "Tool output text block requires 'text'");
                  }

                  chatcmpl_output["type"] = "text";
              } else if (type == "input_image") {
                  if (!chatcmpl_output.contains("image_url") ||
                      !chatcmpl_output.at("image_url").is_string()) {
                      throw std::invalid_argument(
                          "Tool output image block requires string 'image_url'");
                  }

                  const std::string url =
                      chatcmpl_output.at("image_url").get<std::string>();

                  chatcmpl_output = {
                      {"type", "image_url"},
                      {"image_url", {
                          {"url", url}
                      }}
                  };
              } else {
                  throw std::invalid_argument(
                      "Unsupported tool output content type: " + type);
              }
          } else {
              throw std::invalid_argument(
                  "Unsupported tool output content");
          }
          '@

          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
              Write-Host ""
              Write-Host "Patch target was not found."

              Select-String `
                  -Path $path `
                  -Pattern "Output of tool call|input_text|chatcmpl_output" `
                  -Context 20,20

              Write-Error "Codex compatibility patch was NOT applied."
              exit 1
          }

          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8

          Write-Host ""
          Write-Host "========================================="
          Write-Host " Patch applied"
          Write-Host "========================================="

          git diff -- $path

      # ============================================================
      # Verify Codex patch
      # ============================================================
      - name: Verify Codex patch
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          if (-not $content.Contains("Codex function_call_output item")) {
              Write-Error "Debug logging was not found."
              exit 1
          }

          if (-not $content.Contains('type == "input_image"')) {
              Write-Error "input_image support was not found."
              exit 1
          }

          if (-not $content.Contains('{"type", "image_url"}')) {
              Write-Error "image_url conversion was not found."
              exit 1
          }

          if (-not $content.Contains('type == "output_text"')) {
              Write-Error "output_text support was not found."
              exit 1
          }

          Write-Host "Codex compatibility patch verification OK."

      # ============================================================
      # CUDA 13.3
      # ============================================================
      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: 'x64'

      # ============================================================
      # Verify CUDA
      # ============================================================
      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          where.exe nvcc
          nvcc --version

          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              Write-Error "nvcc.exe was not found."
              exit 1
          }

      # ============================================================
      # Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          ninja --version

      # ============================================================
      # Restore build cache
      #
      # IMPORTANT:
      # New cache namespace for exact preview-v0.4.7 commit.
      # Never reuse v0.4.6 objects.
      # ============================================================
      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build
          key: beellama-v047-preview-0d055e1-win2022-cuda133-sm75real-sm89real-faoff-server-v1

      # ============================================================
      # Show cache status
      # ============================================================
      - name: Show cache status
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Build cache"
          Write-Host "========================================="

          if ("${{ steps.build-cache.outputs.cache-hit }}" -eq "true") {
              Write-Host "CACHE HIT"
              Write-Host "Existing v0.4.7 Preview objects may be reused."
          }
          else {
              Write-Host "CACHE MISS"
              Write-Host "A clean v0.4.7 Preview build will be performed."
          }

      # ============================================================
      # Configure
      #
      # RTX 2080 Ti       = Turing = sm_75
      # RTX 4070 Ti SUPER = Ada    = sm_89
      #
      # "-real":
      # native SASS only for these architectures.
      #
      # ============================================================
      - name: Configure BeeLlama
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo ===== Compiler =====
          where cl
          cl

          echo ===== CUDA =====
          where nvcc
          nvcc --version

          echo ===== Ninja =====
          where ninja
          ninja --version

          echo ===== Configure =====

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="75-real;89-real"

          if errorlevel 1 exit /b 1

      # ============================================================
      # Verify CMake configuration
      # ============================================================
      - name: Verify CMake configuration
        shell: pwsh
        run: |
          $cache = "build\CMakeCache.txt"

          if (-not (Test-Path $cache)) {
              Write-Error "CMakeCache.txt was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Relevant CMake options:"

          Select-String `
              -Path $cache `
              -Pattern "CMAKE_CUDA_ARCHITECTURES|GGML_CUDA_FA_ALL_QUANTS|GGML_CUDA_FA:|GGML_CUDA:"

          $arch = Select-String `
              -Path $cache `
              -Pattern "^CMAKE_CUDA_ARCHITECTURES"

          if (-not $arch) {
              Write-Error "CMAKE_CUDA_ARCHITECTURES was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host $arch.Line

          if ($arch.Line -notmatch "75-real;89-real") {
              Write-Error "Expected CUDA architectures 75-real;89-real."
              exit 1
          }

          $quant = Select-String `
              -Path $cache `
              -Pattern "^GGML_CUDA_FA_ALL_QUANTS"

          if ($quant) {
              Write-Host ""
              Write-Host "ALL_QUANTS:"
              Write-Host $quant.Line

              if ($quant.Line -notmatch "OFF") {
                  Write-Error "GGML_CUDA_FA_ALL_QUANTS is not OFF."
                  exit 1
              }
          }

          Write-Host ""
          Write-Host "Configuration OK:"
          Write-Host "sm75-real + sm89-real"
          Write-Host "Flash Attention = ON"
          Write-Host "FA ALL QUANTS = OFF"

      # ============================================================
      # Build llama-server ONLY
      # ============================================================
      - name: Build llama-server only
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo ===== Build llama-server =====

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            --parallel

          if errorlevel 1 exit /b 1

      # ============================================================
      # Locate built server
      # ============================================================
      - name: Show build output
        shell: pwsh
        run: |
          Write-Host "Build output:"

          Get-ChildItem `
              build\bin `
              -Recurse `
              -File

      # ============================================================
      # CRITICAL verification
      #
      # Check BOTH:
      #
      # 1. binary was built from 0d055e1
      # 2. -bd / -ubd really exist
      #
      # Artifact creation stops if either check fails.
      # ============================================================
      - name: Verify v0.4.7 Preview binary and ubd support
        shell: pwsh
        run: |
          if (Test-Path "build\bin\Release\llama-server.exe") {
              $server = "build\bin\Release\llama-server.exe"
          }
          elseif (Test-Path "build\bin\llama-server.exe") {
              $server = "build\bin\llama-server.exe"
          }
          else {
              Write-Error "llama-server.exe was not found."
              exit 1
          }

          Write-Host "========================================="
          Write-Host " Binary"
          Write-Host "========================================="
          Write-Host $server

          Write-Host ""
          Write-Host "========================================="
          Write-Host " Version"
          Write-Host "========================================="

          $versionOutput = (& $server --version 2>&1 | Out-String)
          Write-Host $versionOutput

          if ($versionOutput -notmatch "0d055e1") {
              Write-Error "Wrong BeeLlama binary commit."
              Write-Error "Expected binary commit containing: 0d055e1"
              exit 1
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " Draft sizing options"
          Write-Host "========================================="

          $helpOutput = (& $server --help 2>&1 | Out-String)

          $helpOutput -split "`r?`n" |
              Select-String `
                  -Pattern "spec-draft-batch-size|spec-draft-ubatch-size|-bd|-ubd"

          if ($helpOutput -notmatch "spec-draft-batch-size") {
              Write-Error "--spec-draft-batch-size was NOT found."
              exit 1
          }

          if ($helpOutput -notmatch "spec-draft-ubatch-size") {
              Write-Error "--spec-draft-ubatch-size was NOT found."
              exit 1
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " v0.4.7 Preview verification PASSED"
          Write-Host "========================================="
          Write-Host "Commit : 0d055e1"
          Write-Host "-bd    : supported"
          Write-Host "-ubd   : supported"

      # ============================================================
      # Create package
      # ============================================================
      - name: Create package
        shell: pwsh
        run: |
          $package = "package"

          Remove-Item `
              $package `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Path $package `
              -Force |
              Out-Null

          if (Test-Path "build\bin\Release\llama-server.exe") {
              $bin = "build\bin\Release"
          }
          elseif (Test-Path "build\bin\llama-server.exe") {
              $bin = "build\bin"
          }
          else {
              Write-Error "Built llama-server.exe was not found."
              exit 1
          }

          Write-Host "Using binary directory:"
          Write-Host $bin

          # ----------------------------------------------------------
          # llama-server.exe
          # ----------------------------------------------------------
          $server = Join-Path $bin "llama-server.exe"

          Copy-Item `
              $server `
              -Destination $package `
              -Force

          # ----------------------------------------------------------
          # Runtime DLLs
          # ----------------------------------------------------------
          Get-ChildItem `
              $bin `
              -Filter "*.dll" `
              -File |
              Copy-Item `
                  -Destination $package `
                  -Force

          # ----------------------------------------------------------
          # Source information
          # ----------------------------------------------------------
          git rev-parse HEAD |
              Out-File `
                  "$package\source-commit.txt" `
                  -Encoding ascii

          git describe --tags --always |
              Out-File `
                  "$package\source-version.txt" `
                  -Encoding ascii

          git diff |
              Out-File `
                  "$package\codex-tool-output-image-fix.patch" `
                  -Encoding utf8

          # ----------------------------------------------------------
          # CLI verification results
          # ----------------------------------------------------------
          & $server --version 2>&1 |
              Out-File `
                  "$package\llama-server-version.txt" `
                  -Encoding utf8

          & $server --help 2>&1 |
              Select-String `
                  -Pattern "spec-draft-batch-size|spec-draft-ubatch-size|-bd|-ubd" |
              Out-File `
                  "$package\draft-batch-options.txt" `
                  -Encoding utf8

          # ----------------------------------------------------------
          # Build information
          # ----------------------------------------------------------
          @"
          BeeLlama v0.4.7 Preview Codex compatibility build

          Source:
          BeeLlama v0.4.7 Preview

          Release tag:
          preview-v0.4.7

          Fixed source commit:
          0d055e157fd3

          OS:
          Windows x64

          Compiler:
          Microsoft Visual C++ / Visual Studio 2022

          Generator:
          Ninja Multi-Config

          CUDA:
          13.3

          CUDA architectures:
          sm_75-real
          RTX 2080 Ti / Turing

          sm_89-real
          RTX 4070 Ti SUPER / Ada

          Build target:
          llama-server only

          Build options:
          GGML_CUDA=ON
          GGML_NATIVE=OFF
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=OFF
          LLAMA_BUILD_TESTS=OFF
          CMAKE_CUDA_ARCHITECTURES=75-real;89-real

          BeeLlama v0.4.7 Preview features verified:
          --spec-draft-batch-size
          -bd

          --spec-draft-ubatch-size
          -ubd

          v0.4.7 Preview defaults:
          draft batch size:
          512

          draft ubatch size:
          128

          GitHub Actions build cache:
          enabled

          Codex Responses API compatibility:
          Supported function_call_output content:
          - raw string
          - input_text
          - output_text
          - text
          - input_image

          Text blocks normalize to:
          type = text

          Image blocks normalize to:
          type = image_url
          image_url.url = original image_url

          Debug logging:
          Codex function_call_output item: <raw JSON>

          Intended Codex fixes:
          HTTP 400:
          Output of tool call should be 'Input text'

          HTTP 400:
          Output of tool call should be 'input_text' or 'output_text'

          HTTP 400:
          Output of tool call should contain text
          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8

      # ============================================================
      # Verify packaged binary
      #
      # Run checks AGAIN against the actual EXE that will be zipped.
      # ============================================================
      - name: Verify packaged binary
        shell: pwsh
        run: |
          $server = "package\llama-server.exe"

          if (-not (Test-Path $server)) {
              Write-Error "Packaged llama-server.exe was not found."
              exit 1
          }

          $cuda = Get-ChildItem `
              package `
              -Filter "ggml-cuda.dll" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $cuda) {
              Write-Error "ggml-cuda.dll was not packaged."
              exit 1
          }

          Write-Host "========================================="
          Write-Host " Packaged server version"
          Write-Host "========================================="

          $versionOutput = (& $server --version 2>&1 | Out-String)
          Write-Host $versionOutput

          if ($versionOutput -notmatch "0d055e1") {
              Write-Error "Packaged EXE is not from expected v0.4.7 Preview commit."
              exit 1
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " Packaged server draft options"
          Write-Host "========================================="

          $helpOutput = (& $server --help 2>&1 | Out-String)

          $helpOutput -split "`r?`n" |
              Select-String `
                  -Pattern "spec-draft-batch-size|spec-draft-ubatch-size|-bd|-ubd"

          if ($helpOutput -notmatch "spec-draft-batch-size") {
              Write-Error "Packaged EXE has no -bd support."
              exit 1
          }

          if ($helpOutput -notmatch "spec-draft-ubatch-size") {
              Write-Error "Packaged EXE has no -ubd support."
              exit 1
          }

          Write-Host ""
          Write-Host "Packaged files:"

          Get-ChildItem `
              package `
              -File |
              Sort-Object Name

          Write-Host ""
          Write-Host "========================================="
          Write-Host " PACKAGE VERIFICATION PASSED"
          Write-Host "========================================="

      # ============================================================
      # ZIP
      # ============================================================
      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "beellama-preview-v0.4.7-0d055e1-codex-cuda13.3-sm75-sm89-faoff-server.zip"

          Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

          Compress-Archive `
              -Path package\* `
              -DestinationPath $zip `
              -Force

          Write-Host ""
          Write-Host "========================================="
          Write-Host " ZIP"
          Write-Host "========================================="

          Get-Item $zip |
              Select-Object `
                  Name,
                  @{N="MiB";E={[math]::Round($_.Length / 1MB, 2)}}

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-preview-v0.4.7-0d055e1-codex-cuda13.3-sm75-sm89-faoff-server
          path: beellama-preview-v0.4.7-0d055e1-codex-cuda13.3-sm75-sm89-faoff-server.zip
          if-no-files-found: error
