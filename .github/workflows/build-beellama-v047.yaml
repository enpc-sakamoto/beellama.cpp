name: Build BeeLlama v0.4.7 Preview ubd Codex Fix CUDA 12.4 sm75 sm89

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      # ============================================================
      # Checkout BeeLlama
      #
      # Pin commit containing:
      #   --spec-draft-ubatch-size
      #   -ubd
      #
      # ============================================================

      - name: Checkout BeeLlama pinned commit
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: 1156b183630eb8bd76ff931348d0b1a258ae171b
          fetch-depth: 0
          submodules: recursive


      # ============================================================
      # Verify source commit
      # ============================================================

      - name: Verify pinned BeeLlama commit
        id: source
        shell: pwsh
        run: |
          $expected = "1156b183630eb8bd76ff931348d0b1a258ae171b"
          $actual = (git rev-parse HEAD).Trim()

          Write-Host "========================================="
          Write-Host " BeeLlama source"
          Write-Host "========================================="
          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"

          if ($actual -ne $expected) {
              Write-Error "Unexpected BeeLlama commit."
              exit 1
          }

          Write-Host ""
          git describe --tags --always
          git log -1 --oneline

          "commit=$actual" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Verify original Codex patch target exists
      # ============================================================

      - name: Verify Codex patch target
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          if (-not $content.Contains("Output of tool call should be 'Input text'")) {
              Write-Error "Expected Codex patch target was not found."
              exit 1
          }

          Write-Host "Codex patch target found."


      # ============================================================
      # Codex Responses API compatibility patch
      #
      # Supports function_call_output content:
      #
      #   raw string
      #   input_text
      #   output_text
      #   text
      #   input_image
      #
      # ============================================================

      - name: Patch Codex tool output compatibility
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}\s*chatcmpl_output\["type"\]\s*=\s*"text"\s*;'

          $replacement = @'
          SRV_WRN("Codex function_call_output item: %s\n",
                  chatcmpl_output.dump().c_str());

          if (chatcmpl_output.is_string()) {
              chatcmpl_output = {
                  {"type", "text"},
                  {"text", chatcmpl_output.get<std::string>()}
              };
          } else if (chatcmpl_output.is_object()) {
              const std::string type =
                  json_value(chatcmpl_output, "type", std::string());

              if (type == "input_text" ||
                  type == "output_text" ||
                  type == "text") {

                  if (!chatcmpl_output.contains("text") ||
                      !chatcmpl_output.at("text").is_string()) {

                      throw std::invalid_argument(
                          "Tool output text block requires 'text'");
                  }

                  chatcmpl_output["type"] = "text";

              } else if (type == "input_image") {

                  if (!chatcmpl_output.contains("image_url") ||
                      !chatcmpl_output.at("image_url").is_string()) {

                      throw std::invalid_argument(
                          "Tool output image block requires string 'image_url'");
                  }

                  const std::string url =
                      chatcmpl_output.at("image_url").get<std::string>();

                  chatcmpl_output = {
                      {"type", "image_url"},
                      {"image_url", {
                          {"url", url}
                      }}
                  };

              } else {

                  throw std::invalid_argument(
                      "Unsupported tool output content type: " + type);
              }

          } else {

              throw std::invalid_argument(
                  "Unsupported tool output content");
          }
          '@

          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
              Write-Host ""
              Write-Host "Patch target was not replaced."

              Select-String `
                  -Path $path `
                  -Pattern "Output of tool call|chatcmpl_output" `
                  -Context 20,20

              Write-Error "Codex compatibility patch failed."
              exit 1
          }

          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8

          Write-Host "========================================="
          Write-Host " Codex patch applied"
          Write-Host "========================================="

          git diff -- $path


      # ============================================================
      # Verify Codex patch
      # ============================================================

      - name: Verify Codex patch
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          $required = @(
              "Codex function_call_output item",
              'type == "input_image"',
              'type == "output_text"',
              '{"type", "image_url"}'
          )

          foreach ($item in $required) {
              if (-not $content.Contains($item)) {
                  Write-Error "Codex patch verification failed: $item"
                  exit 1
              }
          }

          Write-Host "Codex compatibility patch verification OK."


      # ============================================================
      # CUDA 12.4.1
      #
      # External GitHub Action.
      # No dependency on local .github/actions directory.
      #
      # ============================================================

      - name: Install CUDA Toolkit 12.4.1
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.1'
          method: 'network'


      # ============================================================
      # Verify CUDA
      # ============================================================

      - name: Verify CUDA 12.4
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " CUDA"
          Write-Host "========================================="

          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          where.exe nvcc

          $nvcc = (& nvcc --version 2>&1 | Out-String)

          Write-Host $nvcc

          if ($nvcc -notmatch "release 12\.4") {
              Write-Error "Expected CUDA 12.4."
              exit 1
          }

          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              Write-Error "nvcc.exe was not found under CUDA_PATH."
              exit 1
          }

          Write-Host "CUDA 12.4 OK."


      # ============================================================
      # Resolve Visual Studio dynamically
      #
      # windows-2022 currently has VS Enterprise 2022,
      # but use vswhere instead of hard-coding edition path.
      #
      # ============================================================

      - name: Resolve Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              Write-Error "vswhere.exe was not found."
              exit 1
          }

          $vsPath = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath

          $vsPath = $vsPath.Trim()

          if (-not $vsPath) {
              Write-Error "Visual Studio installation was not found."
              exit 1
          }

          $vcvars = Join-Path `
              $vsPath `
              "VC\Auxiliary\Build\vcvarsall.bat"

          if (-not (Test-Path $vcvars)) {
              Write-Error "vcvarsall.bat was not found: $vcvars"
              exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          Write-Host "vcvarsall:"
          Write-Host $vcvars

          "path=$vsPath" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Ninja
      # ============================================================

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

          where.exe ninja
          ninja --version


      # ============================================================
      # Build cache
      # ============================================================

      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build
          key: beellama-1156b183630e-win2022-cuda1241-sm75-sm89-faoff-v2


      - name: Show cache status
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Build cache"
          Write-Host "========================================="

          if ("${{ steps.build-cache.outputs.cache-hit }}" -eq "true") {
              Write-Host "CACHE HIT"
          }
          else {
              Write-Host "CACHE MISS"
          }


      # ============================================================
      # Configure BeeLlama
      #
      # RTX 2080 Ti       = sm_75
      # RTX 4070 Ti SUPER = sm_89
      #
      # ============================================================

      - name: Configure BeeLlama
        shell: cmd
        run: |
          set "VS_PATH=${{ steps.vs.outputs.path }}"

          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          echo =========================================
          echo Compiler
          echo =========================================

          where cl
          if errorlevel 1 exit /b 1

          cl


          echo =========================================
          echo CUDA
          echo =========================================

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version


          echo =========================================
          echo Ninja
          echo =========================================

          where ninja
          if errorlevel 1 exit /b 1

          ninja --version


          echo =========================================
          echo Configure
          echo =========================================

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="75-real;89-real"

          if errorlevel 1 exit /b 1


      # ============================================================
      # Verify CMake options
      # ============================================================

      - name: Verify CMake configuration
        shell: pwsh
        run: |
          $cache = "build\CMakeCache.txt"

          if (-not (Test-Path $cache)) {
              Write-Error "CMakeCache.txt was not found."
              exit 1
          }

          Write-Host "========================================="
          Write-Host " CMake configuration"
          Write-Host "========================================="

          Select-String `
              -Path $cache `
              -Pattern "CMAKE_CUDA_ARCHITECTURES|GGML_CUDA_FA_ALL_QUANTS|GGML_CUDA_FA:|GGML_CUDA:"

          $cuda = Select-String `
              -Path $cache `
              -Pattern "^GGML_CUDA:"

          if (-not $cuda -or $cuda.Line -notmatch "=ON") {
              Write-Error "GGML_CUDA is not ON."
              exit 1
          }


          $fa = Select-String `
              -Path $cache `
              -Pattern "^GGML_CUDA_FA:"

          if (-not $fa -or $fa.Line -notmatch "=ON") {
              Write-Error "GGML_CUDA_FA is not ON."
              exit 1
          }


          $allQuants = Select-String `
              -Path $cache `
              -Pattern "^GGML_CUDA_FA_ALL_QUANTS:"

          if (-not $allQuants -or $allQuants.Line -notmatch "=OFF") {
              Write-Error "GGML_CUDA_FA_ALL_QUANTS is not OFF."
              exit 1
          }


          $arch = Select-String `
              -Path $cache `
              -Pattern "^CMAKE_CUDA_ARCHITECTURES"

          if (-not $arch) {
              Write-Error "CMAKE_CUDA_ARCHITECTURES not found."
              exit 1
          }

          if ($arch.Line -notmatch "75-real;89-real") {
              Write-Error "Expected 75-real;89-real."
              exit 1
          }


          Write-Host ""
          Write-Host "CMake configuration OK."


      # ============================================================
      # Build llama-server only
      # ============================================================

      - name: Build llama-server
        shell: cmd
        run: |
          set "VS_PATH=${{ steps.vs.outputs.path }}"

          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1

          echo =========================================
          echo Build llama-server
          echo =========================================

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            --parallel

          if errorlevel 1 exit /b 1


      # ============================================================
      # Locate output
      # ============================================================

      - name: Show build output
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Build output"
          Write-Host "========================================="

          Get-ChildItem `
              build `
              -Recurse `
              -File |
              Where-Object {
                  $_.Name -eq "llama-server.exe" -or
                  $_.Extension -eq ".dll"
              } |
              Select-Object FullName


      # ============================================================
      # Verify -ubd
      #
      # IMPORTANT:
      #
      # Check:
      #   --spec-draft-ubatch-size
      #   -ubd
      #
      # Do NOT require:
      #   --spec-draft-batch-size
      #   -bd
      #
      # ============================================================

      - name: Verify draft ubatch option
        shell: pwsh
        run: |
          $server = Get-ChildItem `
              build `
              -Recurse `
              -Filter "llama-server.exe" `
              -File |
              Select-Object -First 1

          if (-not $server) {
              Write-Error "llama-server.exe was not found."
              exit 1
          }

          Write-Host "Server:"
          Write-Host $server.FullName
          Write-Host ""

          $helpOutput = (& $server.FullName --help 2>&1 | Out-String)

          Write-Host "========================================="
          Write-Host " Draft ubatch option"
          Write-Host "========================================="

          $matches = $helpOutput -split "`r?`n" |
              Select-String `
                  -Pattern "spec-draft-ubatch-size|-ubd"

          $matches |
              ForEach-Object {
                  Write-Host $_.Line
              }

          if ($helpOutput -notmatch "spec-draft-ubatch-size") {
              Write-Error "--spec-draft-ubatch-size / -ubd was NOT found."
              exit 1
          }

          Write-Host ""
          Write-Host "OK: -ubd is available."


      # ============================================================
      # Show speculative options
      # ============================================================

      - name: Show speculative options
        shell: pwsh
        run: |
          $server = Get-ChildItem `
              build `
              -Recurse `
              -Filter "llama-server.exe" `
              -File |
              Select-Object -First 1

          $helpOutput = (& $server.FullName --help 2>&1 | Out-String)

          $helpOutput -split "`r?`n" |
              Select-String `
                  -Pattern "spec-draft|draft-device|draft-ngl|ubd" |
              ForEach-Object {
                  Write-Host $_.Line
              }


      # ============================================================
      # Package
      # ============================================================

      - name: Create package
        shell: pwsh
        run: |
          $package = "package"

          Remove-Item `
              $package `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Path $package `
              -Force |
              Out-Null


          # ----------------------------------------------------------
          # Find llama-server.exe
          # ----------------------------------------------------------

          $server = Get-ChildItem `
              build `
              -Recurse `
              -Filter "llama-server.exe" `
              -File |
              Select-Object -First 1

          if (-not $server) {
              Write-Error "llama-server.exe was not found."
              exit 1
          }

          $bin = $server.Directory.FullName

          Write-Host "Binary directory:"
          Write-Host $bin


          # ----------------------------------------------------------
          # EXE
          # ----------------------------------------------------------

          Copy-Item `
              $server.FullName `
              -Destination $package `
              -Force


          # ----------------------------------------------------------
          # DLLs
          # ----------------------------------------------------------

          Get-ChildItem `
              $bin `
              -Filter "*.dll" `
              -File |
              Copy-Item `
                  -Destination $package `
                  -Force


          # ----------------------------------------------------------
          # Source commit
          # ----------------------------------------------------------

          git rev-parse HEAD |
              Out-File `
                  "$package\source-commit.txt" `
                  -Encoding ascii


          # ----------------------------------------------------------
          # Source version
          # ----------------------------------------------------------

          git describe --tags --always |
              Out-File `
                  "$package\source-version.txt" `
                  -Encoding ascii


          # ----------------------------------------------------------
          # Codex patch
          # ----------------------------------------------------------

          git diff -- tools/server/server-chat.cpp |
              Out-File `
                  "$package\codex-tool-output-image-fix.patch" `
                  -Encoding utf8


          # ----------------------------------------------------------
          # Binary version
          # ----------------------------------------------------------

          (& $server.FullName --version 2>&1 | Out-String) |
              Out-File `
                  "$package\llama-server-version.txt" `
                  -Encoding utf8


          # ----------------------------------------------------------
          # Draft options
          # ----------------------------------------------------------

          $helpOutput = (& $server.FullName --help 2>&1 | Out-String)

          $helpOutput -split "`r?`n" |
              Select-String `
                  -Pattern "spec-draft|draft-device|draft-ngl|ubd" |
              ForEach-Object {
                  $_.Line
              } |
              Out-File `
                  "$package\draft-options.txt" `
                  -Encoding utf8


          # ----------------------------------------------------------
          # CUDA version
          # ----------------------------------------------------------

          (& nvcc --version 2>&1 | Out-String) |
              Out-File `
                  "$package\cuda-version.txt" `
                  -Encoding utf8


          # ----------------------------------------------------------
          # Visual Studio path
          # ----------------------------------------------------------

          @"
          ${{ steps.vs.outputs.path }}
          "@ |
              Out-File `
                  "$package\visual-studio-path.txt" `
                  -Encoding utf8


          # ----------------------------------------------------------
          # Build info
          # ----------------------------------------------------------

          @"
          BeeLlama v0.4.7 Preview pinned build
          =====================================

          Source repository:
          Anbeeld/beellama.cpp

          Source commit:
          1156b183630eb8bd76ff931348d0b1a258ae171b


          Feature required:

          --spec-draft-ubatch-size
          -ubd


          Draft sizing behavior:

          Target logical batch:
          inherited from -b

          Target physical ubatch:
          -ub

          Draft physical ubatch:
          -ubd


          Example:

          -b 2048
          -ub 1024
          -ubd 128


          OS:
          Windows Server 2022

          Runner:
          windows-2022


          CUDA:
          12.4.1


          CUDA architectures:

          75-real
          RTX 2080 Ti

          89-real
          RTX 4070 Ti SUPER


          Build target:
          llama-server


          Build options:

          GGML_CUDA=ON
          GGML_NATIVE=OFF
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=OFF
          LLAMA_BUILD_TESTS=OFF

          CMAKE_CUDA_ARCHITECTURES=75-real;89-real


          Codex Responses compatibility:

          raw string
          input_text
          output_text
          text
          input_image


          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8


      # ============================================================
      # Verify package
      # ============================================================

      - name: Verify package
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Package"
          Write-Host "========================================="

          Get-ChildItem `
              package `
              -File |
              Sort-Object Name |
              Select-Object Name, Length


          $requiredFiles = @(
              "package\llama-server.exe",
              "package\draft-options.txt",
              "package\BUILD-INFO.txt",
              "package\source-commit.txt",
              "package\codex-tool-output-image-fix.patch"
          )

          foreach ($file in $requiredFiles) {
              if (-not (Test-Path $file)) {
                  Write-Error "Missing package file: $file"
                  exit 1
              }
          }


          $cudaDll = Get-ChildItem `
              package `
              -Filter "ggml-cuda.dll" `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $cudaDll) {
              Write-Error "ggml-cuda.dll was not packaged."
              exit 1
          }


          $draftOptions = Get-Content `
              "package\draft-options.txt" `
              -Raw

          if ($draftOptions -notmatch "spec-draft-ubatch-size") {
              Write-Error "-ubd was not preserved in draft-options.txt."
              exit 1
          }


          Write-Host ""
          Write-Host "Package verification OK."


      # ============================================================
      # ZIP
      # ============================================================

      - name: Create ZIP
        shell: pwsh
        run: |
          $commit = "${{ steps.source.outputs.commit }}"
          $short = $commit.Substring(0, 12)

          $zip = "beellama-preview-v0.4.7-$short-ubd-codex-cuda12.4-sm75-sm89.zip"

          Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

          Compress-Archive `
              -Path package\* `
              -DestinationPath $zip `
              -Force

          Write-Host "========================================="
          Write-Host " ZIP"
          Write-Host "========================================="

          Get-Item $zip |
              Select-Object `
                  Name,
                  @{N="MiB";E={[math]::Round($_.Length / 1MB, 2)}}


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-preview-v0.4.7-1156b183630e-ubd-codex-cuda12.4-sm75-sm89
          path: beellama-preview-v0.4.7-1156b183630e-ubd-codex-cuda12.4-sm75-sm89.zip
          if-no-files-found: error
