name: Build BeeLlama v0.4.7 CUDA 13.3 sm75 sm89 NVFP4 Disabled

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      BEELLAMA_COMMIT: 1156b183630eb8bd76ff931348d0b1a258ae171b
      CUDA_VERSION: 13.3.0

    steps:
      - name: Checkout BeeLlama
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: ${{ env.BEELLAMA_COMMIT }}
          submodules: recursive
          fetch-depth: 1

      - name: Verify source commit
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          Write-Host "HEAD = $commit"

          if ($commit -ne "${{ env.BEELLAMA_COMMIT }}") {
            Write-Error "Unexpected commit: $commit"
            exit 1
          }

      - name: Install CUDA Toolkit 13.3
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'
          method: 'network'

      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          $nvcc = Get-Command nvcc -ErrorAction SilentlyContinue

          if (-not $nvcc) {
            Write-Error "nvcc was not found."
            exit 1
          }

          nvcc --version

      - name: Setup Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found."
            exit 1
          }

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            Write-Error "Visual Studio installation not found."
            exit 1
          }

          Write-Host "VS=$vs"

          "VS_INSTALL_PATH=$vs" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

          ninja --version

      - name: Disable NVFP4 MMQ
        shell: pwsh
        run: |
          $cmake = "ggml/src/ggml-cuda/CMakeLists.txt"
          $cuh   = "ggml/src/ggml-cuda/mmq.cuh"
          $cu    = "ggml/src/ggml-cuda/mmq.cu"

          if (-not (Test-Path $cmake)) {
            Write-Error "$cmake not found"
            exit 1
          }

          if (-not (Test-Path $cuh)) {
            Write-Error "$cuh not found"
            exit 1
          }

          if (-not (Test-Path $cu)) {
            Write-Error "$cu not found"
            exit 1
          }

          $cmakeContent = Get-Content $cmake -Raw

          $needle = 'file(GLOB SRCS "template-instances/mmq*.cu")'

          if ($cmakeContent -notmatch [regex]::Escape($needle)) {
            Write-Error "MMQ glob was not found in CMakeLists.txt"
            exit 1
          }

          $replacement = @'
          file(GLOB SRCS "template-instances/mmq*.cu")
          list(FILTER SRCS EXCLUDE REGEX "mmq-instance-nvfp4\\.cu$")
          '@

          $cmakeContent = $cmakeContent.Replace(
            $needle,
            $replacement.Trim()
          )

          Set-Content `
            -Path $cmake `
            -Value $cmakeContent `
            -Encoding utf8

          $cuhLines = Get-Content $cuh

          $cuhLines = $cuhLines | Where-Object {
            $_ -notmatch 'DECL_MMQ_CASE\(GGML_TYPE_NVFP4\)'
          }

          Set-Content `
            -Path $cuh `
            -Value $cuhLines `
            -Encoding utf8

          $cuContent = Get-Content $cu -Raw

          $patterns = @(
            '(?ms)\s*case\s+GGML_TYPE_NVFP4\s*:\s*mul_mat_q_case<GGML_TYPE_NVFP4>\s*\(\s*ctx\s*,\s*args\s*,\s*stream\s*\)\s*;\s*break\s*;',
            '(?ms)\s*case\s+GGML_TYPE_NVFP4\s*:\s*mul_mat_q_case<GGML_TYPE_NVFP4>\s*\([^;]+;\s*break\s*;'
          )

          foreach ($pattern in $patterns) {
            $cuContent = [regex]::Replace(
              $cuContent,
              $pattern,
              '',
              [System.Text.RegularExpressions.RegexOptions]::Multiline
            )
          }

          Set-Content `
            -Path $cu `
            -Value $cuContent `
            -Encoding utf8

      - name: Verify NVFP4 MMQ disabled
        shell: pwsh
        run: |
          $failed = $false

          $cmake = "ggml/src/ggml-cuda/CMakeLists.txt"
          $cuh   = "ggml/src/ggml-cuda/mmq.cuh"
          $cu    = "ggml/src/ggml-cuda/mmq.cu"

          Write-Host "========================================="
          Write-Host "CMake NVFP4 exclusion"
          Write-Host "========================================="

          $cmakeMatch = Select-String `
            -Path $cmake `
            -Pattern 'mmq-instance-nvfp4'

          $cmakeMatch | ForEach-Object {
            Write-Host $_.Line
          }

          if (-not $cmakeMatch) {
            Write-Error "NVFP4 exclusion is missing from CMakeLists.txt"
            $failed = $true
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "NVFP4 MMQ declaration"
          Write-Host "========================================="

          $decl = Select-String `
            -Path $cuh `
            -Pattern 'DECL_MMQ_CASE\(GGML_TYPE_NVFP4\)'

          if ($decl) {
            $decl | ForEach-Object { Write-Host $_.Line }
            Write-Error "NVFP4 MMQ declaration still exists."
            $failed = $true
          } else {
            Write-Host "NVFP4 MMQ declaration removed."
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "NVFP4 MMQ dispatch"
          Write-Host "========================================="

          $dispatch = Select-String `
            -Path $cu `
            -Pattern 'case\s+GGML_TYPE_NVFP4'

          if ($dispatch) {
            $dispatch | ForEach-Object { Write-Host $_.Line }
            Write-Error "NVFP4 MMQ dispatch still exists."
            $failed = $true
          } else {
            Write-Host "NVFP4 MMQ dispatch removed."
          }

          if ($failed) {
            exit 1
          }

      - name: Check NVFP4 template file
        shell: pwsh
        run: |
          $file = "ggml/src/ggml-cuda/template-instances/mmq-instance-nvfp4.cu"

          if (Test-Path $file) {
            Write-Host "NVFP4 source exists but is excluded from build:"
            Write-Host $file
          } else {
            Write-Host "NVFP4 source file does not exist in this source tree."
          }

      - name: Clean build directory
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          if (Test-Path package) {
            Remove-Item package -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path build `
            -Force | Out-Null

      - name: Configure CMake
        shell: pwsh
        run: |
          $vs = $env:VS_INSTALL_PATH

          $vcvars = Join-Path `
            $vs `
            "VC\Auxiliary\Build\vcvars64.bat"

          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvars64.bat not found: $vcvars"
            exit 1
          }

          cmd /c "`"$vcvars`" && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable(
                  $matches[1],
                  $matches[2]
                )
              }
            }

          cmake `
            -S . `
            -B build `
            -G "Ninja Multi-Config" `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CUDA_FA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="75-real;89-real"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Show CUDA architecture config
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "CUDA architectures"
          Write-Host "========================================="

          Select-String `
            -Path "build/CMakeCache.txt" `
            -Pattern "CMAKE_CUDA_ARCHITECTURES"

      - name: Build llama-server
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --target llama-server `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate llama-server
        shell: pwsh
        run: |
          $server = Get-ChildItem `
            -Path build `
            -Filter llama-server.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $server) {
            Write-Error "llama-server.exe not found."
            exit 1
          }

          Write-Host "Found: $($server.FullName)"

          "LLAMA_SERVER=$($server.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Inspect binary version
        shell: pwsh
        continue-on-error: true
        run: |
          $server = $env:LLAMA_SERVER

          Write-Host "========================================="
          Write-Host "Binary version"
          Write-Host "========================================="

          $output = (& $server --version 2>&1 | Out-String)

          Write-Host $output

          if ($output -match '0\.4\.7') {
            Write-Host "Version 0.4.7 detected."
          } else {
            Write-Warning "Binary does not report version 0.4.7."
          }

          if ($output -match '1156b1836') {
            Write-Host "Commit 1156b1836 detected."
          } else {
            Write-Warning "Commit 1156b1836 not found in binary version output."
          }

          $output |
            Set-Content `
              -Path "binary-version.txt" `
              -Encoding utf8

      - name: Verify draft ubatch support
        shell: pwsh
        continue-on-error: true
        run: |
          $server = $env:LLAMA_SERVER

          Write-Host "========================================="
          Write-Host "Draft ubatch options"
          Write-Host "========================================="

          $help = (& $server --help 2>&1 | Out-String)

          $matches = $help -split "`r?`n" |
            Where-Object {
              $_ -match 'spec-draft-ubatch|ubd'
            }

          if ($matches) {
            $matches | ForEach-Object {
              Write-Host $_
            }

            Write-Host ""
            Write-Host "-ubd support detected."
          } else {
            Write-Warning "-ubd / --spec-draft-ubatch-size was NOT found."
          }

          $matches |
            Set-Content `
              -Path "draft-options.txt" `
              -Encoding utf8

      - name: Record CUDA version
        shell: pwsh
        continue-on-error: true
        run: |
          nvcc --version 2>&1 |
            Tee-Object `
              -FilePath "cuda-version.txt"

      - name: Record source information
        shell: pwsh
        continue-on-error: true
        run: |
          git rev-parse HEAD |
            Set-Content `
              -Path "source-commit.txt" `
              -Encoding utf8

          git status --short |
            Set-Content `
              -Path "source-status.txt" `
              -Encoding utf8

          git diff |
            Set-Content `
              -Path "source-patches.diff" `
              -Encoding utf8

      - name: Package build
        if: always()
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path package `
            -Force | Out-Null

          $server = Get-ChildItem `
            -Path build `
            -Filter llama-server.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($server) {
            Copy-Item `
              $server.FullName `
              "package\llama-server.exe" `
              -Force

            $binDir = $server.Directory.FullName

            Get-ChildItem `
              -Path $binDir `
              -Filter "*.dll" `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Copy-Item `
                  $_.FullName `
                  "package\$($_.Name)" `
                  -Force
              }
          } else {
            Write-Warning "llama-server.exe was not found."
          }

          $infoFiles = @(
            "binary-version.txt",
            "draft-options.txt",
            "cuda-version.txt",
            "source-commit.txt",
            "source-status.txt",
            "source-patches.diff"
          )

          foreach ($file in $infoFiles) {
            if (Test-Path $file) {
              Copy-Item `
                $file `
                "package\$file" `
                -Force
            }
          }

          @"
          BeeLlama build

          Source commit:
          ${{ env.BEELLAMA_COMMIT }}

          CUDA:
          ${{ env.CUDA_VERSION }}

          CUDA architectures:
          sm75  RTX 2080 Ti
          sm89  RTX 4070 Ti SUPER

          sm86 / RTX 3080 Ti:
          NOT INCLUDED

          NVFP4 MMQ:
          DISABLED

          GGML_CUDA:
          ON

          GGML_CUDA_FA:
          ON

          GGML_CUDA_FA_ALL_QUANTS:
          OFF

          llama-server only:
          YES
          "@ |
            Set-Content `
              -Path "package\BUILD-INFO.txt" `
              -Encoding utf8

      - name: Create ZIP
        if: always()
        shell: pwsh
        run: |
          if (Test-Path package) {
            $files = Get-ChildItem package -File

            if ($files.Count -gt 0) {
              Compress-Archive `
                -Path "package\*" `
                -DestinationPath "beellama-v0.4.7-cuda133-sm75-sm89-no-nvfp4.zip" `
                -Force
            } else {
              Write-Warning "Package directory is empty."
            }
          }

      - name: Upload BeeLlama artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beellama-v0.4.7-cuda133-sm75-sm89-no-nvfp4
          path: |
            package/**
            beellama-v0.4.7-cuda133-sm75-sm89-no-nvfp4.zip
          if-no-files-found: warn
          retention-days: 14
