
    
  
          NVFP4 MMQ:
          DISABLED

          Removed:
          ggml/src/ggml-cuda/template-instances/mmq-instance-nvfp4.cu

          Removed declaration:
          DECL_MMQ_CASE(GGML_TYPE_NVFP4)

          Removed dispatcher:
          case GGML_TYPE_NVFP4

          Build options:

          GGML_CUDA=ON
          GGML_NATIVE=OFF
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=OFF
          LLAMA_BUILD_TESTS=OFF

          CMAKE_CUDA_ARCHITECTURES=75-real;89-real

          Required BeeLlama option:

          --spec-draft-ubatch-size
          -ubd

          Codex Responses API compatibility:

          raw string
          input_text
          output_text
          text
          input_image
          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8


          Write-Host "========================================="
          Write-Host " Package contents"
          Write-Host "========================================="

          Get-ChildItem `
              $package `
              -File |
              Sort-Object Name |
              Select-Object Name, Length


      # ============================================================
      # Create ZIP
      # ============================================================

      - name: Create ZIP
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "package\llama-server.exe")) {
              Write-Warning "No llama-server.exe to package."
              exit 0
          }

          $zip = "beellama-preview-v0.4.7-4c007d272841-ubd-codex-cuda13.3-sm75-sm89-no-nvfp4.zip"

          Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

          Compress-Archive `
              -Path package\* `
              -DestinationPath $zip `
              -Force

          Write-Host "========================================="
          Write-Host " ZIP"
          Write-Host "========================================="

          Get-Item $zip |
              Select-Object `
                  Name,
                  @{N="MiB";E={[math]::Round($_.Length / 1MB, 2)}}


      # ============================================================
      # Upload ZIP artifact
      #
      # Runs even if diagnostics failed.
      # ============================================================

      - name: Upload ZIP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beellama-preview-v0.4.7-4c007d272841-ubd-codex-cuda13.3-sm75-sm89-no-nvfp4
          path: beellama-preview-v0.4.7-4c007d272841-ubd-codex-cuda13.3-sm75-sm89-no-nvfp4.zip
          if-no-files-found: warn
          retention-days: 14


      # ============================================================
      # Emergency raw artifact
      #
      # If ZIP/package logic fails after successful compilation,
      # preserve EXE + DLLs directly.
      # ============================================================

      - name: Upload raw build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beellama-raw-build-4c007d272841-cuda13.3-sm75-sm89-no-nvfp4
          path: |
            build/bin/Release/llama-server.exe
            build/bin/Release/*.dll
            build/bin/llama-server.exe
            build/bin/*.dll
          if-no-files-found: warn
          retention-days: 14

