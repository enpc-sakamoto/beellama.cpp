name: Build BeeLlama v0.4.7 Preview Codex Fix sm75 sm89

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout official BeeLlama v0.4.7 Preview directly
      # ============================================================
      - name: Checkout BeeLlama v0.4.7 Preview
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          ref: preview-v0.4.7
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # Verify source
      # ============================================================
      - name: Verify BeeLlama source
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " BeeLlama source"
          Write-Host "========================================="

          git remote -v

          Write-Host ""
          Write-Host "Version:"
          git describe --tags --always

          Write-Host ""
          Write-Host "Commit:"
          $commit = (git rev-parse HEAD).Trim()
          Write-Host $commit

          if (-not $commit.StartsWith("0d055e1")) {
              Write-Error "Wrong BeeLlama commit."
              Write-Error "Expected: 0d055e1..."
              Write-Error "Actual:   $commit"
              exit 1
          }

          Write-Host ""
          Write-Host "BeeLlama v0.4.7 Preview source verification OK."

      # ============================================================
      # Verify v0.4.7 draft batch features exist in source
      # ============================================================
      - name: Verify v0.4.7 source features
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Verify draft batch options in source"
          Write-Host "========================================="

          $matches = Get-ChildItem `
              -Path common,tools `
              -Recurse `
              -File `
              -Include *.cpp,*.h,*.hpp `
              -ErrorAction SilentlyContinue |
              Select-String `
                  -Pattern "spec-draft-ubatch-size|spec-draft-batch-size|spec_draft_ubatch|spec_draft_batch" `
                  -ErrorAction SilentlyContinue

          if (-not $matches) {
              Write-Error "v0.4.7 draft batch options were not found in source."
              exit 1
          }

          $matches |
              Select-Object -First 30 |
              ForEach-Object {
                  Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              }

          Write-Host ""
          Write-Host "Draft sizing source verification OK."

      # ============================================================
      # Codex Responses API compatibility patch
      #
      # Handles:
      #   raw string
      #   input_text
      #   output_text
      #   text
      #   input_image
      # ============================================================
      - name: Patch Codex tool output compatibility
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          Write-Host "========================================="
          Write-Host " Original Codex patch target"
          Write-Host "========================================="

          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text|chatcmpl_output" `
              -Context 10,10

          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}\s*chatcmpl_output\["type"\]\s*=\s*"text"\s*;'

          $replacement = @'
          SRV_WRN("Codex function_call_output item: %s\n",
                  chatcmpl_output.dump().c_str());

          if (chatcmpl_output.is_string()) {
              chatcmpl_output = {
                  {"type", "text"},
                  {"text", chatcmpl_output.get<std::string>()}
              };
          } else if (chatcmpl_output.is_object()) {
              const std::string type =
                  json_value(chatcmpl_output, "type", std::string());

              if (type == "input_text" ||
                  type == "output_text" ||
                  type == "text") {
                  if (!chatcmpl_output.contains("text") ||
                      !chatcmpl_output.at("text").is_string()) {
                      throw std::invalid_argument(
                          "Tool output text block requires 'text'");
                  }

                  chatcmpl_output["type"] = "text";
              } else if (type == "input_image") {
                  if (!chatcmpl_output.contains("image_url") ||
                      !chatcmpl_output.at("image_url").is_string()) {
                      throw std::invalid_argument(
                          "Tool output image block requires string 'image_url'");
                  }

                  const std::string url =
                      chatcmpl_output.at("image_url").get<std::string>();

                  chatcmpl_output = {
                      {"type", "image_url"},
                      {"image_url", {
                          {"url", url}
                      }}
                  };
              } else {
                  throw std::invalid_argument(
                      "Unsupported tool output content type: " + type);
              }
          } else {
              throw std::invalid_argument(
                  "Unsupported tool output content");
          }
          '@

          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
              Write-Host ""
              Write-Host "Patch target was not found."

              Select-String `
                  -Path $path `
                  -Pattern "Output of tool call|input_text|chatcmpl_output" `
                  -Context 20,20

              Write-Error "Codex compatibility patch was NOT applied."
              exit 1
          }

          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8

          Write-Host ""
          Write-Host "========================================="
          Write-Host " Patch applied"
          Write-Host "========================================="

          git diff -- $path

      # ============================================================
      # Verify Codex patch
      # ============================================================
      - name: Verify Codex patch
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          if (-not $content.Contains("Codex function_call_output item")) {
              Write-Error "Debug logging was not found."
              exit 1
          }

          if (-not $content.Contains('type == "input_image"')) {
              Write-Error "input_image support was not found."
              exit 1
          }

          if (-not $content.Contains('{"type", "image_url"}')) {
              Write-Error "image_url conversion was not found."
              exit 1
          }

          if (-not $content.Contains('type == "output_text"')) {
              Write-Error "output_text support was not found."
              exit 1
          }

          Write-Host "Codex compatibility patch verification OK."

      # ============================================================
      # Install CUDA 13.3
      # ============================================================
      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: 'x64'

      # ============================================================
      # Verify CUDA
      # ============================================================
      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"

          where.exe nvcc
          nvcc --version

          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              Write-Error "nvcc.exe was not found."
              exit 1
          }

      # ============================================================
      # Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          ninja --version

      # ============================================================
      # Restore build cache
      #
      # Separate cache key from v0.4.6.
      # ============================================================
      - name: Restore build cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build
          key: beellama-preview-v047-0d055e1-win2022-cuda133-sm75-sm89-faoff-v1

      # ============================================================
      # Show cache status
      # ============================================================
      - name: Show cache status
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host " Build cache"
          Write-Host "========================================="

          if ("${{ steps.build-cache.outputs.cache-hit }}" -eq "true") {
              Write-Host "CACHE HIT"
          }
          else {
              Write-Host "CACHE MISS"
          }

      # ============================================================
      # Configure
      #
      # RTX 2080 Ti       = sm75
      # RTX 4070 Ti SUPER = sm89
      # ============================================================
      - name: Configure BeeLlama
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo ===== Compiler =====
          where cl
          cl

          echo ===== CUDA =====
          where nvcc
          nvcc --version

          echo ===== Ninja =====
          where ninja
          ninja --version

          echo ===== Configure =====

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA_FA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="75-real;89-real"

          if errorlevel 1 exit /b 1

      # ============================================================
      # Verify CMake configuration
      # ============================================================
      - name: Verify CMake configuration
        shell: pwsh
        run: |
          $cache = "build\CMakeCache.txt"

          if (-not (Test-Path $cache)) {
              Write-Error "CMakeCache.txt was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Relevant CMake options:"

          Select-String `
              -Path $cache `
              -Pattern "CMAKE_CUDA_ARCHITECTURES|GGML_CUDA_FA_ALL_QUANTS|GGML_CUDA_FA:|GGML_CUDA:"

          $arch = Select-String `
              -Path $cache `
              -Pattern "^CMAKE_CUDA_ARCHITECTURES"

          if (-not $arch) {
              Write-Error "CMAKE_CUDA_ARCHITECTURES was not found."
              exit 1
          }

          if ($arch.Line -notmatch "75-real;89-real") {
              Write-Error "Expected CUDA architectures 75-real;89-real."
              exit 1
          }

          $quant = Select-String `
              -Path $cache `
              -Pattern "^GGML_CUDA_FA_ALL_QUANTS"

          if ($quant -and $quant.Line -notmatch "OFF") {
              Write-Error "GGML_CUDA_FA_ALL_QUANTS is not OFF."
              exit 1
          }

          Write-Host ""
          Write-Host "CMake configuration OK."

      # ============================================================
      # Build llama-server only
      # ============================================================
      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            --parallel

          if errorlevel 1 exit /b 1

      # ============================================================
      # Locate binary
      # ============================================================
      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem `
              build\bin `
              -Recurse `
              -File

      # ============================================================
      # Verify binary version and -bd / -ubd
      # ============================================================
      - name: Verify v0.4.7 Preview binary
        shell: pwsh
        run: |
          if (Test-Path "build\bin\Release\llama-server.exe") {
              $server = "build\bin\Release\llama-server.exe"
          }
          elseif (Test-Path "build\bin\llama-server.exe") {
              $server = "build\bin\llama-server.exe"
          }
          else {
              Write-Error "llama-server.exe was not found."
              exit 1
          }

          Write-Host "========================================="
          Write-Host " Version"
          Write-Host "========================================="

          $versionOutput = (& $server --version 2>&1 | Out-String)
          Write-Host $versionOutput

          if ($versionOutput -notmatch "0d055e1") {
              Write-Error "Wrong BeeLlama binary commit."
              exit 1
          }

          Write-Host ""
          Write-Host "========================================="
          Write-Host " Draft batch options"
          Write-Host "========================================="

          $helpOutput = (& $server --help 2>&1 | Out-String)

          $helpOutput -split "`r?`n" |
              Select-String `
                  -Pattern "spec-draft-batch-size|spec-draft-ubatch-size"

          if ($helpOutput -notmatch "spec-draft-batch-size") {
              Write-Error "--spec-draft-batch-size was NOT found."
              exit 1
          }

          if ($helpOutput -notmatch "spec-draft-ubatch-size") {
              Write-Error "--spec-draft-ubatch-size was NOT found."
              exit 1
          }

          Write-Host ""
          Write-Host "v0.4.7 Preview binary verification PASSED."

      # ============================================================
      # Package
      # ============================================================
      - name: Create package
        shell: pwsh
        run: |
          $package = "package"

          Remove-Item `
              $package `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Path $package `
              -Force |
              Out-Null

          if (Test-Path "build\bin\Release\llama-server.exe") {
              $bin = "build\bin\Release"
          }
          elseif (Test-Path "build\bin\llama-server.exe") {
              $bin = "build\bin"
          }
          else {
              Write-Error "Built llama-server.exe was not found."
              exit 1
          }

          $server = Join-Path $bin "llama-server.exe"

          Copy-Item `
              $server `
              -Destination $package `
              -Force

          Get-ChildItem `
              $bin `
              -Filter "*.dll" `
              -File |
              Copy-Item `
                  -Destination $package `
                  -Force

          git rev-parse HEAD |
              Out-File `
                  "$package\source-commit.txt" `
                  -Encoding ascii

          git describe --tags --always |
              Out-File `
                  "$package\source-version.txt" `
                  -Encoding ascii

          git diff |
              Out-File `
                  "$package\codex-tool-output-image-fix.patch" `
                  -Encoding utf8

          & $server --version 2>&1 |
              Out-File `
                  "$package\llama-server-version.txt" `
                  -Encoding utf8

          & $server --help 2>&1 |
              Select-String `
                  -Pattern "spec-draft-batch-size|spec-draft-ubatch-size" |
              Out-File `
                  "$package\draft-batch-options.txt" `
                  -Encoding utf8

          @"
          BeeLlama v0.4.7 Preview custom build

          Source repository:
          https://github.com/Anbeeld/beellama.cpp

          Source tag:
          preview-v0.4.7

          Expected source commit:
          0d055e1

          Platform:
          Windows x64

          Compiler:
          MSVC / Visual Studio 2022

          CUDA:
          13.3

          CUDA architectures:
          sm75-real
          sm89-real

          Target GPUs:
          RTX 2080 Ti
          RTX 4070 Ti SUPER

          Build:
          GGML_CUDA=ON
          GGML_NATIVE=OFF
          GGML_CUDA_FA=ON
          GGML_CUDA_FA_ALL_QUANTS=OFF
          LLAMA_BUILD_TESTS=OFF

          Built target:
          llama-server

          BeeLlama v0.4.7 Preview draft options verified:
          --spec-draft-batch-size
          --spec-draft-ubatch-size

          Codex Responses API compatibility patch:
          raw string
          input_text
          output_text
          text
          input_image
          "@ |
              Out-File `
                  "$package\BUILD-INFO.txt" `
                  -Encoding utf8

      # ============================================================
      # Verify packaged EXE
      # ============================================================
      - name: Verify packaged binary
        shell: pwsh
        run: |
          $server = "package\llama-server.exe"

          if (-not (Test-Path $server)) {
              Write-Error "Packaged llama-server.exe was not found."
              exit 1
          }

          if (-not (Test-Path "package\ggml-cuda.dll")) {
              Write-Error "ggml-cuda.dll was not packaged."
              exit 1
          }

          Write-Host "========================================="
          Write-Host " Packaged version"
          Write-Host "========================================="

          $versionOutput = (& $server --version 2>&1 | Out-String)
          Write-Host $versionOutput

          if ($versionOutput -notmatch "0d055e1") {
              Write-Error "Packaged EXE is not expected v0.4.7 Preview."
              exit 1
          }

          $helpOutput = (& $server --help 2>&1 | Out-String)

          if ($helpOutput -notmatch "spec-draft-batch-size") {
              Write-Error "Packaged EXE has no draft batch option."
              exit 1
          }

          if ($helpOutput -notmatch "spec-draft-ubatch-size") {
              Write-Error "Packaged EXE has no draft ubatch option."
              exit 1
          }

          Write-Host ""
          Write-Host "Packaged files:"

          Get-ChildItem `
              package `
              -File |
              Sort-Object Name

          Write-Host ""
          Write-Host "PACKAGE VERIFICATION PASSED."

      # ============================================================
      # ZIP
      # ============================================================
      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "beellama-preview-v0.4.7-0d055e1-codex-cuda13.3-sm75-sm89.zip"

          Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue

          Compress-Archive `
              -Path package\* `
              -DestinationPath $zip `
              -Force

          Get-Item $zip |
              Select-Object `
                  Name,
                  @{N="MiB";E={[math]::Round($_.Length / 1MB, 2)}}

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beellama-preview-v0.4.7-0d055e1-codex-cuda13.3-sm75-sm89
          path: beellama-preview-v0.4.7-0d055e1-codex-cuda13.3-sm75-sm89.zip
          if-no-files-found: error
