name: Build BeeLlama v0.4.7 Preview ubd Codex CUDA13.3 sm86only no-NVFP4 mmqfix TurboPrefill

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      # ============================================================
      # Checkout BeeLlama pinned commit
      # ============================================================

      - name: Checkout BeeLlama repository
        uses: actions/checkout@v4
        with:
          repository: Anbeeld/beellama.cpp
          fetch-depth: 0
          submodules: recursive


      # ============================================================
      # Checkout and verify pinned preview commit
      # ============================================================

      - name: Checkout pinned preview commit
        id: source
        shell: pwsh
        run: |
          $expected = "4c007d272841"

          git fetch --all --tags --force
          git checkout $expected
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Unable to checkout BeeLlama commit $expected."
              exit 1
          }

          git submodule sync --recursive
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Submodule update failed."
              exit 1
          }

          $actual = (git rev-parse --short=12 HEAD).Trim()
          $actualFull = (git rev-parse HEAD).Trim()

          Write-Host "========================================="
          Write-Host " BeeLlama source"
          Write-Host "========================================="

          Write-Host "Expected: $expected"
          Write-Host "Actual:   $actual"
          Write-Host "Full:     $actualFull"

          if ($actual -ne $expected) {
              Write-Error "Unexpected BeeLlama commit."
              exit 1
          }

          git describe --tags --always
          git log -1 --oneline

          "commit=$actualFull" >> $env:GITHUB_OUTPUT


      # ============================================================
      # Verify Codex patch target
      # ============================================================

      - name: Verify Codex patch target
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          Write-Host "========================================="
          Write-Host " Codex patch target"
          Write-Host "========================================="

          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text|chatcmpl_output" `
              -Context 10,10

          if (-not $content.Contains("Output of tool call should be 'Input text'")) {
              Write-Error "Expected Codex patch target was not found."
              exit 1
          }

          Write-Host "Codex patch target OK."


      # ============================================================
      # Codex Responses API compatibility patch
      # ============================================================

      - name: Patch Codex tool output compatibility
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          $pattern = 'if\s*\(\s*!chatcmpl_output\.contains\("type"\)\s*\|\|\s*chatcmpl_output\.at\("type"\)\s*!=\s*"input_text"\s*\)\s*\{\s*throw\s+std::invalid_argument\("Output of tool call should be ''Input text''"\);\s*\}\s*chatcmpl_output\["type"\]\s*=\s*"text"\s*;'

          $replacement = @'
          SRV_WRN("Codex function_call_output item: %s\n",
                  chatcmpl_output.dump().c_str());

          if (chatcmpl_output.is_string()) {
              chatcmpl_output = {
                  {"type", "text"},
                  {"text", chatcmpl_output.get<std::string>()}
              };

          } else if (chatcmpl_output.is_object()) {
              const std::string type =
                  json_value(chatcmpl_output, "type", std::string());

              if (type == "input_text" ||
                  type == "output_text" ||
                  type == "text") {

                  if (!chatcmpl_output.contains("text") ||
                      !chatcmpl_output.at("text").is_string()) {
                      throw std::invalid_argument(
                          "Tool output text block requires 'text'");
                  }

                  chatcmpl_output["type"] = "text";

              } else if (type == "input_image") {

                  if (!chatcmpl_output.contains("image_url") ||
                      !chatcmpl_output.at("image_url").is_string()) {
                      throw std::invalid_argument(
                          "Tool output image block requires string 'image_url'");
                  }

                  const std::string url =
                      chatcmpl_output.at("image_url").get<std::string>();

                  chatcmpl_output = {
                      {"type", "image_url"},
                      {"image_url", {
                          {"url", url}
                      }}
                  };

              } else {
                  throw std::invalid_argument(
                      "Unsupported tool output content type: " + type);
              }

          } else {
              throw std::invalid_argument(
                  "Unsupported tool output content");
          }
          '@

          $patched = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          if ($patched -eq $content) {
              Write-Host ""
              Write-Host "Patch target was not replaced."

              Select-String `
                  -Path $path `
                  -Pattern "Output of tool call|chatcmpl_output" `
                  -Context 20,20

              Write-Error "Codex compatibility patch failed."
              exit 1
          }

          Set-Content `
              -Path $path `
              -Value $patched `
              -NoNewline `
              -Encoding UTF8

          Write-Host "========================================="
          Write-Host " Codex patch applied"
          Write-Host "========================================="

          git diff -- $path


      # ============================================================
      # Verify Codex patch
      # ============================================================

      - name: Verify Codex patch
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"
          $content = Get-Content $path -Raw

          $required = @(
              "Codex function_call_output item",
              'type == "input_image"',
              'type == "output_text"',
              '{"type", "image_url"}'
          )

          foreach ($item in $required) {
              if (-not $content.Contains($item)) {
                  Write-Error "Codex patch verification failed: $item"
                  exit 1
              }
          }

          Write-Host "Codex compatibility patch verification OK."


