      # ============================================================
      # Verify Codex patch target
      # ============================================================

      - name: Verify Codex patch target
        shell: pwsh
        run: |
          $path = "tools/server/server-chat.cpp"

          if (-not (Test-Path $path)) {
              Write-Error "File not found: $path"
              exit 1
          }

          $content = Get-Content $path -Raw

          Write-Host "========================================="
          Write-Host " Codex patch target"
          Write-Host "========================================="

          Select-String `
              -Path $path `
              -Pattern "Output of tool call|input_text|chatcmpl_output" `
              -Context 10,10

          if (-not $content.Contains("Output of tool call should be 'Input text'")) {
              Write-Error "Expected Codex patch target was not found."
              exit 1
          }

          Write-Host "Codex patch target OK."


